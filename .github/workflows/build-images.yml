name: Build and Push Images

on:
  push:
    branches: [main, feature/god-mode-17-phases]
    paths:
      - agent-verse-backend/**
      - agent-verse-frontend/**
      - .github/workflows/build-images.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Optional image tag override
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: agent-verse-backend
            image: agentverse-backend
            build_args: INSTALL_PLAYWRIGHT=false
          - name: frontend
            context: agent-verse-frontend
            image: agentverse-frontend
            build_args: VITE_API_URL=/api,VITE_GRAFANA_URL=/grafana
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_SHA}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
          build-args: |
            ${{ matrix.build_args }}
