name: AgentVerse Nightly

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC every night
  workflow_dispatch:       # manual trigger

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # ── Full backend test suite (including slow/integration markers) ────────────
  backend-full:
    name: Backend Full Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-verse-backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentverse
          POSTGRES_PASSWORD: agentverse
          POSTGRES_DB: agentverse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    env:
      DATABASE_URL: "postgresql+asyncpg://agentverse:agentverse@localhost:5432/agentverse_test"
      REDIS_URL: "redis://localhost:6379/0"
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy app --ignore-missing-imports
        continue-on-error: true

      - name: Apply migrations
        run: uv run alembic upgrade head
        continue-on-error: true   # DB may not have all tables in CI schema

      - name: Run full test suite (including integration)
        run: uv run pytest tests/ -q --tb=short -m "not slow" --cov=app --cov-report=xml
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: agent-verse-backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # ── Real-infra e2e_full tier (WS-8) — the whole-platform e2e suite ───────────
  # Gates EVERY real-infra e2e: goal+HITL lifecycle, org any-task mission, RPA→PDF,
  # ingestion+OCR world-class, KB convergence (RPA+OCR→one store), rerank-on-default,
  # and the REAL out-of-process Celery workflow run (trigger→worker→terminal, no
  # `_mock`) + scheduled-fire governance + workflow-HITL. E2E_* env vars point the
  # e2e conftest at the CI services, so a down/broken backing service FAILS the job
  # (it does not silently skip — WS-8 negative-verification requirement).
  backend-e2e-full:
    name: Backend e2e_full (real infra)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-verse-backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentverse
          POSTGRES_PASSWORD: agentverse
          POSTGRES_DB: agentverse_e2e
        ports: ["55432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # The e2e_full conftest uses these external URLs instead of testcontainers,
      # so the tier runs against the CI services and FAILS (never skips) if they
      # are unavailable. Non-default ports match infra/docker-compose.e2e.yml.
      E2E_DATABASE_URL: "postgresql+asyncpg://agentverse:agentverse@localhost:55432/agentverse_e2e"
      E2E_REDIS_URL: "redis://localhost:56379/0"
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Assert e2e_full tier is not silently empty
        run: |
          count=$(uv run pytest tests/e2e_full -m e2e_full --co -q -o addopts="" 2>/dev/null | grep -c "::" || true)
          echo "collected e2e_full tests: $count"
          if [ "$count" -lt 20 ]; then
            echo "::error::e2e_full tier collapsed to $count tests (<20) — a marker or import is broken"
            exit 1
          fi

      - name: Run e2e_full suite (real Postgres + Redis + real Celery worker)
        run: uv run pytest tests/e2e_full -m e2e_full -q --tb=short -o addopts=""
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  # ── Frontend full test suite ────────────────────────────────────────────────
  frontend-full:
    name: Frontend Full Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-verse-frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agent-verse-frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Unit tests with coverage
        run: npm run test -- --coverage

      - name: Build
        run: npm run build

  # ── Playwright full E2E suite ────────────────────────────────────────────────
  playwright-full:
    name: Playwright Full Suite
    runs-on: ubuntu-latest
    needs: [frontend-full]
    defaults:
      run:
        working-directory: agent-verse-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agent-verse-frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run all Playwright projects (no backend needed)
        run: npm run test:e2e -- --project=smoke-live --project=accessibility --project=security-smoke --project=failure-states --project=eval-regression --project=multimodal-live --project=rag-live --project=governance-live --project=observability-live --reporter=line
        continue-on-error: false
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-nightly-report
          path: agent-verse-frontend/playwright-report/

  # ── Live platform tests (conditional on env var or workflow_dispatch) ────────
  live-platform:
    name: Live Platform Tests
    runs-on: ubuntu-latest
    if: ${{ vars.RUN_LIVE_TESTS == 'true' || github.event_name == 'workflow_dispatch' }}
    env:
      LIVE_TEST: "true"
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL || 'postgresql+asyncpg://test:test@localhost/test' }}
      REDIS_URL: ${{ secrets.STAGING_REDIS_URL || 'redis://localhost:6379/0' }}
    defaults:
      run:
        working-directory: agent-verse-backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v2
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync
      - name: Run live platform tests
        run: uv run pytest tests/live/ -v --tb=short -m "not slow"
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        continue-on-error: true  # Live tests are advisory; staging may be down

  # ── Security smoke job ──────────────────────────────────────────────────────
  security-smoke:
    name: Security Smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-verse-backend

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Scan for secrets in source (truffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: .
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
        continue-on-error: true

      - name: Python dependency audit (pip-audit)
        run: uv run pip-audit --ignore-vuln GHSA-jfh8-c2jp-5 || true

      - name: Run security-focused tests
        run: |
          uv run pytest tests/ -q --tb=short -k "security or auth or tenant or pii or inject" -m "not slow and not integration"
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  # ── Real-backend Playwright (WS-8 gap #4) — drives the UI against a LIVE backend ─
  # Unlike playwright-full (mocked), this starts the REAL backend (uvicorn) on a
  # real Postgres+Redis, lets Playwright start the Vite frontend (webServer), and
  # runs the `real-backend` project: mint a tenant via the real signup API →
  # authenticated dashboard → submit a goal → assert the real backend created it
  # and the goal enters live execution. A down backend FAILS the job (no mocks).
  playwright-real-backend:
    name: Playwright Real Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentverse
          POSTGRES_PASSWORD: agentverse
          POSTGRES_DB: agentverse_rbe
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: "postgresql+asyncpg://agentverse:agentverse@localhost:5432/agentverse_rbe"
      REDIS_URL: "redis://localhost:6379/0"
      ENVIRONMENT: "development"
      BASE_URL: "http://localhost:5173"
      API_BASE_URL: "http://localhost:8000"

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v2
        with:
          version: "latest"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agent-verse-frontend/package-lock.json

      - name: Backend — install + migrate
        working-directory: agent-verse-backend
        run: |
          uv sync
          uv run alembic upgrade head

      - name: Backend — start uvicorn and wait for health
        working-directory: agent-verse-backend
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health >/dev/null; then echo "backend healthy"; exit 0; fi
            sleep 2
          done
          echo "::error::backend did not become healthy"; cat /tmp/uvicorn.log; exit 1

      - name: Frontend — install + Playwright browsers
        working-directory: agent-verse-frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the real-backend Playwright project
        working-directory: agent-verse-frontend
        run: npx playwright test --project=real-backend --reporter=line

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-real-backend-report
          path: agent-verse-frontend/playwright-report/

  # ── Nightly summary notification ────────────────────────────────────────────
  notify:
    name: Notify
    needs: [backend-full, backend-e2e-full, frontend-full, security-smoke, playwright-full, playwright-real-backend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report status
        run: |
          echo "Nightly run complete"
          echo "backend-full: ${{ needs.backend-full.result }}"
          echo "backend-e2e-full: ${{ needs.backend-e2e-full.result }}"
          echo "frontend-full: ${{ needs.frontend-full.result }}"
          echo "security-smoke: ${{ needs.security-smoke.result }}"
          echo "playwright-full: ${{ needs.playwright-full.result }}"
          echo "playwright-real-backend: ${{ needs.playwright-real-backend.result }}"
