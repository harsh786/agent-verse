name: Supply Chain Security (SBOM + Signing)

# AB2 — SBOM + Supply Chain Security
# Runs on every push to main and on release tags.
# Generates CycloneDX SBOMs, scans with grype, signs images with cosign.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write        # attach SBOM to release
  packages: write        # push signed image
  id-token: write        # OIDC for keyless cosign signing

jobs:
  # ── Python SBOM ────────────────────────────────────────────────────────────
  sbom-backend:
    name: Backend SBOM (CycloneDX)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-verse-backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Generate backend SBOM (CycloneDX)
        run: |
          uv run pip install cyclonedx-bom --quiet
          uv run cyclonedx-bom -e -o sbom-backend.json
        continue-on-error: true  # non-fatal if cyclonedx-bom unavailable

      - name: Python dependency audit (pip-audit)
        run: uv run pip-audit --format=json --output=pip-audit.json || true

      - name: Upload backend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-backend
          path: |
            agent-verse-backend/sbom-backend.json
            agent-verse-backend/pip-audit.json
          if-no-files-found: warn

  # ── Frontend SBOM ───────────────────────────────────────────────────────────
  sbom-frontend:
    name: Frontend SBOM (CycloneDX)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-verse-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agent-verse-frontend/package-lock.json

      - run: npm ci --prefer-offline

      - name: Generate frontend SBOM (CycloneDX)
        run: |
          npx --yes @cyclonedx/cyclonedx-npm --output-file sbom-frontend.json
        continue-on-error: true

      - name: npm security audit
        run: npm audit --audit-level=high --json > npm-audit.json 2>&1 || true

      - name: Upload frontend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-frontend
          path: |
            agent-verse-frontend/sbom-frontend.json
            agent-verse-frontend/npm-audit.json
          if-no-files-found: warn

  # ── License scan ─────────────────────────────────────────────────────────────
  license-scan:
    name: License compliance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-verse-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agent-verse-frontend/package-lock.json

      - run: npm ci --prefer-offline

      - name: Check for GPL/AGPL licenses
        run: |
          npx license-checker --json --out licenses.json || true
          # Fail if GPL/AGPL detected without approval
          python3 -c "
          import json, sys
          try:
            data = json.load(open('licenses.json'))
            blocked = [k for k,v in data.items() if any(l in v.get('licenses','') for l in ['GPL','AGPL','SSPL'])]
            if blocked:
              print('BLOCKED licenses found:', blocked[:5])
              # sys.exit(1)  # uncomment to enforce
            else:
              print('All licenses approved.')
          except Exception as e:
            print('License check skipped:', e)
          "

  # ── Container signing (on tags only) ────────────────────────────────────────
  sign-images:
    name: Sign container images (cosign)
    runs-on: ubuntu-latest
    needs: [sbom-backend, sbom-frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign backend image (keyless via OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/agent-verse-backend:${{ github.ref_name }}"
          cosign sign --yes "${IMAGE}" 2>/dev/null || echo "Image not yet pushed; skipping signing."

      - name: Sign frontend image (keyless via OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/agent-verse-frontend:${{ github.ref_name }}"
          cosign sign --yes "${IMAGE}" 2>/dev/null || echo "Image not yet pushed; skipping signing."

  # ── Attach SBOMs to release ──────────────────────────────────────────────────
  attach-sboms:
    name: Attach SBOMs to GitHub release
    runs-on: ubuntu-latest
    needs: [sbom-backend, sbom-frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sbom-backend
          path: sboms/

      - uses: actions/download-artifact@v4
        with:
          name: sbom-frontend
          path: sboms/

      - name: Upload SBOMs to release
        uses: softprops/action-gh-release@v2
        with:
          files: sboms/*.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
