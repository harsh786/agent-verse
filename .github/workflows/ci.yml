name: AgentVerse CI Pipeline

on:
  push:
    branches: [ main, feature/god-mode-17-phases ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-verse-backend

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy app --ignore-missing-imports

      - name: Run tests
        run: uv run pytest tests/ -x -q --tb=short -m "not integration and not slow"
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-verse-backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v2
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync
      - name: Run contract/schema tests
        run: uv run pytest tests/ -q --tb=short -k "contract or schema or openapi" -m "not integration and not slow"
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-verse-frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agent-verse-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  playwright-smoke:
    name: Playwright Smoke
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: agent-verse-frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agent-verse-frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:e2e -- --project=smoke-live --reporter=line

      # The step above runs against `npm run dev` (unbundled ESM), and vitest
      # runs in jsdom with no bundling — so nothing in CI ever LOADED the
      # production bundle the `frontend` job builds. A manualChunks defect
      # shipped a completely blank app past a fully green pipeline. Build it and
      # run the same specs against the real artifact.
      - name: Build production bundle
        run: npm run build

      - name: Run smoke tests against the production build
        run: npm run test:e2e:build -- --project=smoke-live --reporter=line

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: agent-verse-frontend/playwright-report/
