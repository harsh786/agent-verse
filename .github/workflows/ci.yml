name: AgentVerse CI Pipeline

on:
  push:
    branches: [ main, feature/god-mode-17-phases ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-verse-backend

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy app --ignore-missing-imports
        continue-on-error: true  # mypy is advisory

      - name: Run tests
        run: uv run pytest tests/ -x -q --tb=short -m "not integration and not slow"
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-verse-frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agent-verse-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  playwright-smoke:
    name: Playwright Smoke
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: agent-verse-frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agent-verse-frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:e2e -- --project=smoke-live --reporter=line
        continue-on-error: true  # Smoke tests require running backend

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: agent-verse-frontend/playwright-report/
