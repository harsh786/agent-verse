## Part 13 — RPA & perception (`app/rpa/`)

RPA is browser automation exposed as tools every agent can call. There are **two RPA stacks**:
the async, Playwright-backed **executor stack** (live) and a synchronous **runner stack**
(orphaned scaffold). Everything the running system uses flows through `RPAExecutor`.

### 13.1 The action model & tools (`app/rpa/tools.py`)

An RPA "action" is just a `(tool_name, arguments)` pair. `RPA_TOOLS` declares 13 tools with a
`risk` field that drives governance:

| Tool | Risk | Purpose |
|------|------|---------|
| `rpa_open_url` | low | navigate |
| `rpa_click` / `rpa_type` | high | click by selector/text; fill input |
| `rpa_extract_text` / `rpa_screenshot` | read | read `inner_text` / capture PNG |
| `rpa_select_option` / `rpa_upload_file` / `rpa_download_file` / `rpa_submit_form` | high | form ops |
| `rpa_wait_for_text` | read | poll until text appears |
| `rpa_detect_captcha` / `rpa_request_human_help` / `rpa_wait_for_network_idle` | read | (stubs) |

Every agent gets these prepended to its tool context (`server_id="rpa"`), so browser automation
is always available.

### 13.2 Execution flow

```mermaid
flowchart TD
    A["agent tool call: rpa_*"] --> EX["RPAExecutor.execute(tool, args, tenant, goal)"]
    EX --> BK{"backend selection"}
    BK -->|Playwright + session mgr| P1["stateful: reuse BrowserSession.page"]
    BK -->|Playwright only| P2["standalone: open+close browser per call"]
    BK -->|neither| SIM["simulation: '[simulated] …' (CI-safe)"]
    P1 --> DISP["if/elif tool dispatch: Chromium (headless)"]
    P2 --> DISP
    DISP --> ART["screenshots → MinIO/temp artifact store"]
    DISP --> R["RPAResult(success, output, artifact_url, duration_ms)"]
```

- **Engine: Playwright + Chromium, headless.** Import is guarded everywhere — no Playwright →
  deterministic **simulation** strings (CI-safe). Risk classification routes `high`-risk clicks/
  types/uploads through the HITL gate (Part 8).
- **Sessions:** `BrowserSessionManager` pools browsers per `(session_id, tenant)` with a
  per-tenant cap and oldest-idle eviction; artifacts (screenshots/downloads) go to a MinIO/temp
  store; screenshots can be vision-analyzed by the embedder (perception).

### 13.3 Perception (`app/perception/`)

Page analysis + vision-via-embedder turns screenshots into structured observations the agent can
reason over (used for visual grounding and the `[Visual context]` prompt slot from Part 7).

### 13.4 Known gaps (flagged honestly)

- **Credential injection is dead in production** (`_credential_injector` never set) — `vault://`
  refs would reach the page literally.
- **The agent path never passes a `session_id`** → every agent RPA call is **ephemeral** (browser
  opened+closed per call); the pooling machinery is effectively unused by the loop.
- `cleanup_expired()` is never scheduled; `rpa_detect_captcha`/`rpa_wait_for_network_idle` are
  simulation-only stubs; the download-artifact upload calls a non-existent `store_bytes` (silently
  falls back to temp); the entire synchronous runner stack is orphaned.

### 13.5 Step-by-step recap (Part 13)

1. Agent emits an `rpa_*` tool call; high-risk verbs route through HITL.
2. `RPAExecutor` picks a backend: pooled Playwright / standalone / simulation.
3. Chromium (headless) runs the action; screenshots/downloads persist to the artifact store.
4. Perception can vision-analyze screenshots into `[Visual context]`.
5. Result returns as `RPAResult`; failures feed ExecutionMemory/SelfOptimizer.

## Part 14 — Evals & agent self-improvement

Evaluation and improvement close the loop: every goal is scored, poor scores trigger learning,
and (for one optimizer) improvements are written back to the agent's config. There are **two
eval stacks** and **three improvement stacks**; this Part maps what actually runs.

### 14.1 How an eval runs (the primary path)

```mermaid
flowchart TD
    V["verify node: goal COMPLETE"] --> ER["EvalRunner.score_and_persist"]
    ER --> D7["7 heuristic dimensions:<br/>task_completion · efficiency · accuracy* · safety<br/>coherence* · sla · tool_relevance"]
    D7 --> JUDGE["* accuracy & coherence via LLM-judge (verifier model)"]
    JUDGE --> AVG["average score, pass ≥ 0.70"]
    AVG --> DB["persist to evaluations table"]
    AVG --> GATE{"score < threshold?"}
    GATE -->|yes| SI["SelfImprovementEngine.decide_actions"]
    GATE -->|no| DONE["done"]
```

- **`EvalRunner`** (`app/intelligence/eval_runner.py`, ACTIVE) scores **7 dimensions** 0–1:
  `task_completion`, `efficiency` (iterations + cost), `accuracy`, `safety` (deny/injection
  events), `coherence`, `sla`, `tool_relevance`. `accuracy` and `coherence` are refined by an
  LLM-judge (the verifier model). Aggregate = mean; **pass threshold 0.70**; a failing run can
  auto-create a regression case.
- **`EvalSuiteRunner`** runs golden-task suites (substring/tool assertions) via the enterprise
  API and powers the agent **rollout gate** (`pass_rate ≥ 0.8` over ≥5 runs).
- The **profile's `EvalConfig`** (Part 2) picks the suite (coding/security/rag/default).

> Maturity: a second, richer 9-dimension **`RuntimeScorecard`** (weighted, coverage-aware) exists
> and drives `SelfImprovementEngine` + `RegressionGate`, but it is **gated behind runtime flags
> that default off** (`dynamic_orchestration`/`enable_runtime_scorecard`). On a stock deployment
> only the 7-dim `EvalRunner` heuristic path runs. The richer `LLMJudge` and the regression-
> promotion/certification machinery are wired-but-inert.

### 14.2 The self-improvement stacks (what actually changes behavior)

```mermaid
flowchart TD
    subgraph LIVE["✅ Actually improve live behavior"]
        RW["ReflexionWirer: failure → lesson → recalled into next planner prompt"]
        V2["SelfOptimizerV2: Bayesian A/B → UPDATE agents SET config"]
        SIE["SelfImprovementEngine: model-downgrade flag + tool blacklist"]
    end
    subgraph COMPUTE["⚠️ Compute-but-never-applied"]
        PO["PromptOptimizer: selects+scores variants, maybe_promote never called"]
        AB["ab_testing: records arms, can_promote never called"]
        SIE2["SelfImprovementEngine: rag/regression actions emit-only"]
    end
    subgraph DEAD["⚪ Orphaned / deprecated"]
        SO1["SelfOptimizer v1 (deprecated, apply is no-op)"]
        OPT["app/optimization/* (except ab_testing)"]
        IAE["ImprovementActionExecutor (empty handler map)"]
    end
```

- **Reflexion loop (ACTIVE, closed):** on failure the `ReflexionWirer` extracts a lesson,
  classifies the failure, and persists it; the next goal recalls up to 5 lessons into
  `_reflexion_lessons`, which flow into the planner prompt (Part 7). This is the platform's real
  cross-goal learning.
- **`SelfOptimizerV2` (ACTIVE + APPLIED):** the *only* optimizer that writes back — it runs a
  Bayesian A/B experiment per (tenant, agent), and on a winning candidate does a real
  `UPDATE agents SET config = :candidate` and writes an `agent_optimization_history` audit row.
- **`SelfImprovementEngine` (PARTIAL):** applies model-downgrade flags and tool blacklists; its
  RAG-strategy and regression-case actions are emitted over SSE but not acted on.

> The headline honesty finding: **`PromptOptimizer` runs a full A/B measurement apparatus every
> goal — selecting variants, recording scores, persisting win/loss — but its promotion step
> (`maybe_promote`) is never called**, so a statistically-winning prompt is never adopted. Much of
> `app/optimization/` and several `app/intelligence/` modules (`improvement_action_executor` with
> an empty handler map, `experiment_registry`, `learning_experiments`, `benchmarking`) are
> scaffolding with no runtime callers. `process_feedback_batch` exists as a Celery task but was
> never added to the beat schedule.

### 14.3 Step-by-step recap (Part 14)

1. On completion the verifier runs `EvalRunner` (7 dims, 2 via LLM-judge), persists scores, pass ≥ 0.70.
2. Golden-task suites + rollout gates guard agent promotion via the enterprise API.
3. On failure the ReflexionWirer stores a lesson that biases the next plan (real closed loop).
4. `SelfOptimizerV2` runs Bayesian A/B and writes winning config back to the agent.
5. Much of the richer eval/optimizer machinery is present but flag-gated or compute-only — treat it as roadmap, not runtime.

## Part 15 — Observability (`app/observability/`)

Everything above is traced, measured, and streamed. Observability has three tiers: active
plumbing (metrics, logging, health, manual spans), active-but-degradable (OTLP tracing, cost
breakdown, SSE decision emitter), and wired-but-inert (SLO tracker, alert router, the
`emit_*_trace` trio).

### 15.1 Tracing, metrics, logging

```mermaid
flowchart LR
    subgraph LOOP["Agent loop spans (manual)"]
        S1["agentverse.goal.run"] --> S2["agentverse.plan"]
        S2 --> S3["agentverse.step.execute"]
        S3 --> S4["agentverse.tool.call"]
        S4 --> S5["agentverse.verify"]
    end
    S1 --> OTLP["OTLP gRPC :4317 → otel-collector"]
    OTLP --> JAEGER["Jaeger (traces, :16686)"]
    OTLP --> PROM2["Prometheus (metrics)"]
    MET["Prometheus registry<br/>agentverse_* metrics"] --> SCRAPE["GET /metrics"]
    LOG["structlog JSON (prod) / console (dev)<br/>contextvars: request_id, tenant_id, goal_id"]
```

- **Tracing** (`tracing.py`): OTLP-over-gRPC exporter → otel-collector → Jaeger; falls back to an
  **in-memory span exporter** (feeding a `/spans` debug endpoint) when no OTLP endpoint. Spans are
  **manually placed** at the loop's node boundaries — there is **no FastAPI/httpx/asyncpg/redis
  auto-instrumentation**, so trace coverage is the agent loop, not HTTP/DB.
- **Metrics** (`metrics.py`): ~28 Prometheus metrics (`agentverse_goal_*`, `tool_call_*`,
  `llm_tokens_*`, `cost_usd_*`, `orchestration_*`, `strategy_*`, …) with strict **cardinality
  control** — `tenant_id` is deliberately never a label; unknown labels collapse to `"unknown"`.
- **Logging** (`logging.py`): structlog, JSON in production; correlation via contextvars
  (`request_id`, `tenant_id`, `goal_id`).
- **Health** (`health.py`): `/health` runs registered dependency checks concurrently (200/503).
- **RuntimeSSEEmitter** (`runtime_decision_trace.py`): pushes structured **decision events** onto
  the goal SSE stream (`runtime_profile_selected`, `rag_strategy_selected`, `model_route_selected`,
  `chunking_strategy_selected`, `embedding_strategy_selected`, `eval_score_recorded`, …) — this is
  how the client sees *why* the agent chose each strategy live.

### 15.2 Maturity notes

- SLO tracking (`slo_tracker.py`) and alert routing (`alert_router.py`, Slack-webhook-ready) are
  fully implemented but **never wired into an evaluation loop** (inert, in-memory).
- The `emit_model_trace / emit_pattern_trace / emit_rag_trace` trio is **dead code** superseded by
  `RuntimeSSEEmitter`.
- Per-role **USD cost is currently recorded as 0.0** at the planner/verifier sites (tokens are
  attributed, dollars are a placeholder).

### 15.3 Step-by-step recap (Part 15)

1. The loop emits manual OTel spans (goal→plan→execute→tool→verify) → OTLP → Jaeger.
2. Prometheus metrics (`/metrics`) track goals, tools, tokens, cost, and orchestration decisions with strict cardinality.
3. structlog emits correlated JSON logs; `/health` gates readiness.
4. The SSE decision emitter streams *why* each strategy/model/chunking/embedding was chosen, live to the client.

communicate to a new engineer, so nothing is mistaken for finished.

## Appendix B — The one-page mental model

```mermaid
flowchart TD
    G["Natural-language goal"] --> CLS["Classify → GoalProperties"]
    CLS --> PROF["Build GoalRuntimeProfile<br/>model · pattern · RAG · security · memory · eval"]
    PROF --> COMPILE["GraphFactory → AgentGraph"]
    COMPILE --> LOOP["initialize → RAG retrieve → plan → execute → verify → route"]
    LOOP -->|retrieve| RAG["pgvector 4-leg RRF + strategy + memory"]
    LOOP -->|each tool| GOV["governance gates + MCP call + guardrails"]
    LOOP -->|each step| GRND["grounding check → replan if ungrounded"]
    LOOP -->|verify| EVAL["EvalRunner score + reflexion + SelfOptimizerV2"]
    LOOP --> DONE["complete / replan / HITL / fail"]
    DONE --> OBS["OTel spans · Prometheus · SSE decision stream"]
```

**In one sentence:** AgentVerse *analyzes each goal to assemble a bespoke execution profile,
compiles a LangGraph agent shaped to that profile, then runs a retrieval-grounded, governed,
self-verifying, self-improving loop over real MCP tools — streaming every decision back live and
learning from every outcome.*

## Appendix C — Glossary

| Term | Meaning |
|------|---------|
| **GoalRuntimeProfile** | The per-goal execution plan: model roles, agent patterns, RAG strategy, security, memory, eval config. |
| **DecisionTrace** | Auditable record of *why* each profile choice was made (persisted to `decision_traces`). |
| **AgentGraph** | The LangGraph state machine compiled per goal from the profile. |
| **AgentState** | The serializable, checkpointable runtime state threaded through the loop. |
| **RRF** | Reciprocal Rank Fusion — fuses vector/FTS/trigram/BM25 retrieval legs. |
| **RAPTOR** | Hierarchical multi-level retrieval index (clustered LLM summaries). |
| **Reflexion** | Failure → lesson → recalled into the next plan (cross-goal learning). |
| **HITL** | Human-in-the-loop approval gateway for high-risk actions. |
| **MCP** | Model Context Protocol — the tool-calling transport to external connectors. |
| **Inert tier** | Code that is present/importable/tested but not reached by the live goal path. |

## The same journey, step by step (numbered walkthrough)

Read this alongside the diagram — each number matches a node.

### ① Entry (two ways a goal starts)
- **E1 — Direct:** a client calls `POST /goals` with a natural-language goal, authenticated by
  the tenant API key; Row-Level Security scopes everything to that tenant.
- **E2 — Automated:** a **trigger** fires (webhook / schedule / NL / event). It runs the
  **12-step dispatch** (RBAC → payload-size → dedup 60s → rate-limit → circuit-breaker →
  bulkhead → CEL condition → template render), then calls `create_goal`. Both paths converge.

### ② Governed submission (`GoalService.submit_goal`)
1. **Daily-limit** check (Redis atomic INCR) — over the plan's daily quota → **REJECT 429**.
2. **Concurrency** check — at the tenant's in-flight cap → **REJECT 429**.
3. **Goal-text dedup** — an identical in-flight goal short-circuits (`deduplicated`). *This is a
   second dedup layer, independent of the trigger's dedup.*
4. **Auto-route** an agent when no `agent_id` was supplied.
5. **Persist** the `GoalRecord`, open the SSE channel.
6. **Enqueue fork** — the master active/inert switch: with a Celery task queue wired
   (`manage_pools + redis_url`) the goal runs on the per-plan queue `goals.{plan}`; otherwise it
   runs **in-process** (`asyncio.create_task`). Enterprise tenants get a dedicated queue (no
   noisy-neighbour).

### ③ Analyze + build the Runtime Profile (*profile-before-compile*)
7. **`classify_fast`** → `GoalProperties` (complexity, risk, domain, time-sensitivity,
   requires_code/web, is_generative) from keyword/token sets, sub-millisecond.
8. If the goal is genuinely **ambiguous** (MEDIUM + low confidence) → an **LLM Tier-2** refine.
9. **PatternSelector** turns properties into six configs: reasoning patterns, RAG strategy,
   model plan, security bundle, memory/cache policy, eval config.
10. **Resolve + compose** strategies against the registry — any unready (`PLANNED`) strategy is
    dropped and replaced with a ready fallback (the "inert-tier" guard).
11. Assemble the **`GoalRuntimeProfile`** and a **`DecisionTrace`** (persisted — every choice is
    auditable).

### ④ Readiness + compile
12. **Readiness gate** — unready adapters substitute a safe default.
13. **`GraphFactory.create`** maps the profile's selected strategies to LangGraph **node flags**
    and compiles an **`AgentGraph`** with a Redis checkpointer.

### ⑤ The agent loop (LangGraph state machine)
14. **initialize** — seed `AgentState`, resume from a DB checkpoint if one exists, stamp the
    start time, emit `goal_started`.
15. **rag_retrieval** — recall winning plans + failures (ExecutionMemory), semantic domain
    knowledge (LongTermMemory pgvector cosine), and run the profile's retrieval strategy on the
    **4-leg RRF** engine (vector + FTS + trigram + BM25) → `rag_context`.
16. **[opt] think / tree_of_thoughts** — only when the profile enabled CoT/ToT.
17. **plan (Planner LLM)** — assemble ~10 labelled context slots, rerank/budget/cite via
    `ContextPipeline`, compress, and emit an ordered `steps[]`.
18. **execute (Executor LLM)** — for **each step and each tool call**, in order:
    - Permission `DENY` → **FAIL**.
    - Guardrails **A** (regex) + **B** (six-layer) on step/args.
    - Policy `DENY` → **FAIL**; `REQUIRE_APPROVAL` or high-risk keyword / `write_high` →
      **HITL**; in *supervised* mode this blocks and a rejection → **FAIL**.
    - Executor LLM emits the tool call.
    - **Cost** check — over budget → **skip step** (note: charged for planning tokens first).
    - **exfil guard** blocks secrets/oversized payloads to write sinks.
    - **MCP `call_tool`** — circuit-breaker → result-cache → arg-resolve → dispatch → LLM
      self-heal on arg errors.
    - Output guardrails + sanitize + PII redaction.
    - **Grounding check** — claims vs tool-output evidence; **2 consecutive ungrounded** steps →
      `rag_remediate` (re-retrieve) → replan.
    - **Audit** record.
19. **[opt] refine / self_consistency** — self-refine or majority-vote before verify.
20. **verify (Verifier LLM)** — success / reason / retry, then callbacks:
    - High-risk + primary-fail → **consensus** vote (may escalate to HITL).
    - **EvalRunner** scores 7 dimensions and persists.
    - On failure → **ReflexionWirer** stores a lesson (recalled into the *next* plan).
    - On low score → **SelfOptimizerV2** runs Bayesian A/B and can write the winning config
      back to `agents.config`.
21. **[opt] peer_review**, then the **ROUTE** decision (first match wins):
    - `verification_success` → **COMPLETE**
    - `guardrail_rejected` / `retry=false` / `iteration ≥ max` / stagnation → **FAIL**
    - stuck (3 failed steps) → **replan**
    - supervised + HITL pending → **WAITING_HUMAN**
    - context gap (< 2 remediations) → **rag_remediate**
    - reflection rounds left → **reflect** → replan
    - else → **replan**

### ⑥ Finalize
22. Synthesize a **cited answer**; the final-output guardrail redacts if needed.
23. Write the **LongTermMemory extraction** (embedded) + ExecutionMemory record — the learning
    write-back.
24. Emit the **terminal SSE** event (`goal_complete` / `goal_failed`).
25. **Fan-out** — the event is published to `goal_events:*` on Redis; any API replica bridges it
    to the browser's SSE stream (durable in `EventStore` with a resume cursor), so a goal run on
    a Celery worker streams live to a client attached to a different replica.

### ⑦ Observability (cross-cutting, the whole way)
- **OTel spans** wrap `goal.run → plan → step.execute → tool.call → verify` → OTLP → **Jaeger**.
- **Prometheus** metrics (goals, tools, tokens, cost, orchestration decisions) with strict
  cardinality.
- **RuntimeSSEEmitter** streams *why* each strategy/model/chunking/embedding was chosen, live.
- The **append-only audit trail** records every governed action.

| **REJECT 429 / deduplicated** | Stopped before the loop — quota, concurrency, or duplicate. |
| **HITL wait** | A human must approve a high-risk action (only blocks in *supervised* mode). |
| **skip step / budget exceeded** | The tool call was blocked for cost; the loop continues. |
| **rag_remediate** | The agent lacked evidence (ungrounded) and is re-retrieving before replanning. |
| **replan / reflect** | The verifier failed the attempt; the agent revises its plan (bounded). |
| **FAIL (stagnation / stuck / max-iter)** | Anti-thrash guards stopped a hopeless loop early. |
| **COMPLETE** | The verifier confirmed the goal; a cited answer is synthesized. |

> Every element above is traced to real code in the companion
> [End-to-End Masterclass](00-END-TO-END-MASTERCLASS.md) (Parts 1–15), where each stage is
> expanded with file paths, data structures, and its own focused diagram.
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/svg-pan-zoom/3.6.1/svg-pan-zoom.min.js"></script>
<script>
(function(){
  "use strict";
  var $=function(s,r){return (r||document).querySelector(s)};
  var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};

  var DOCS={
    masterclass:{
      eyebrow:"Platform Masterclass · Parts 1–15",
      title:"How a goal travels through AgentVerse, end to end",
      lede:"A step-by-step, diagram-driven tour of the whole backend — goal intake, goal analysis, runtime-profile assembly, the LangGraph agent loop, RAG, memory, prompt building, guardrails & governance, hallucination handling, tools, workflows, OCR, RPA, evals, and observability — every claim traced to real code under app/.",
      chips:["37 diagrams","profile-before-compile","LangGraph loop","4-leg RRF RAG","code-cited"],
      src:"md-masterclass"
    },
    activity:{
      eyebrow:"One-picture reference",
      title:"The Master Activity Diagram",
      lede:"A single sequential activity flow showing every stage a goal passes through — from arrival (or a trigger firing) to COMPLETE / FAILED / WAITING_HUMAN — with every governance gate, retrieval step, and learning callback in execution order. Click the diagram to zoom.",
      chips:["end-to-end","every branch","7 phases","zoomable"],
      src:"md-activity"
    }
  };

  var THEME={
    read:function(){try{return localStorage.getItem("av-theme")}catch(e){return null}},
    write:function(v){try{localStorage.setItem("av-theme",v)}catch(e){}}
  };
  function currentDark(){
    var t=document.documentElement.getAttribute("data-theme");
    if(t==="dark")return true;
    if(t==="light")return false;
    return window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches;
  }
  function mermaidTheme(){
    var dark=currentDark();
    return {
      startOnLoad:false, securityLevel:"loose", theme:"base",
      fontFamily:'"IBM Plex Sans",system-ui,sans-serif',
      flowchart:{htmlLabels:true,curve:"basis",nodeSpacing:42,rankSpacing:50,useMaxWidth:true},
      sequence:{useMaxWidth:true},
      er:{useMaxWidth:true},
      themeVariables: dark ? {
        background:"transparent", primaryColor:"#1c2130", primaryTextColor:"#e7eaf0",
        primaryBorderColor:"#818cf8", lineColor:"#63708a", secondaryColor:"#20233a",
        tertiaryColor:"#171b25", clusterBkg:"#12151d", clusterBorder:"#333c4b",
        titleColor:"#e7eaf0", edgeLabelBackground:"#12151d", fontSize:"14px",
        nodeTextColor:"#e7eaf0"
      } : {
        background:"transparent", primaryColor:"#eef0fe", primaryTextColor:"#181b22",
        primaryBorderColor:"#4f46e5", lineColor:"#8b93a6", secondaryColor:"#f1e9ff",
        tertiaryColor:"#f5f6f8", clusterBkg:"#fbfbfe", clusterBorder:"#d3d8e2",
        titleColor:"#181b22", edgeLabelBackground:"#ffffff", fontSize:"14px",
        nodeTextColor:"#181b22"
      }
    };
  }

  var content=$("#content"), toc=$("#toc"), masthead=$("#masthead");
  var currentDoc="masterclass", diagCount=0, observer=null;

  function slugify(s){
    return s.toLowerCase().replace(/[^\w\s-]/g,"").trim().replace(/\s+/g,"-").slice(0,64)||("s"+Math.random().toString(36).slice(2,7));
  }

  function renderDoc(key){
    currentDoc=key;
    var def=DOCS[key];
    var raw=$("#"+def.src).textContent;

    // masthead
    masthead.innerHTML='<p class="eyebrow">'+def.eyebrow+'</p><h1>'+def.title+'</h1>'+
      '<p class="lede">'+def.lede+'</p><div class="meta-strip">'+
      def.chips.map(function(c){return '<span class="chip">'+c+'</span>'}).join("")+'</div>';

    // markdown → html
    marked.setOptions({gfm:true,breaks:false});
    content.innerHTML=marked.parse(raw);

    // strip the doc's own H1 (masthead owns the title)
    var h1=content.querySelector("h1"); if(h1) h1.remove();

    // heading ids
    $$("h2,h3",content).forEach(function(h){ if(!h.id) h.id=slugify(h.textContent); });

    // wrap tables for horizontal scroll
    $$("table",content).forEach(function(t){
      var w=document.createElement("div"); w.className="table-wrap";
      t.parentNode.insertBefore(w,t); w.appendChild(t);
    });

    // convert ```mermaid blocks into diagram cards
    diagCount=0;
    $$("pre > code.language-mermaid",content).forEach(function(code){
      diagCount++;
      var rawmm=code.textContent;
      var card=document.createElement("div"); card.className="diagram pending";
      card.innerHTML='<div class="dg-bar"><span class="tag">Diagram '+diagCount+
        '</span><button class="expand" type="button">⛶ Expand</button></div>'+
        '<div class="dg-body"><div class="mermaid"></div></div>';
      var mm=card.querySelector(".mermaid");
      mm.dataset.src=rawmm; mm.textContent=rawmm;
      var pre=code.parentNode; pre.parentNode.replaceChild(card,pre);
    });

    buildToc();
    renderMermaid();
    wireDiagramZoom();
    content.parentElement.parentElement.scrollTop=0;
    window.scrollTo(0,0);
  }

  function renderMermaid(){
    var nodes=$$(".mermaid",content);
    if(!nodes.length) return;
    mermaid.initialize(mermaidTheme());
    nodes.forEach(function(n){ n.removeAttribute("data-processed"); n.innerHTML=n.dataset.src; });
    mermaid.run({nodes:nodes}).then(function(){
      nodes.forEach(function(n){ var c=n.closest(".diagram"); if(c) c.classList.remove("pending"); });
    }).catch(function(e){
      nodes.forEach(function(n){ var c=n.closest(".diagram"); if(c) c.classList.remove("pending"); });
      console.warn("mermaid render issue",e);
    });
  }

  function buildToc(){
    toc.innerHTML="";
    var heads=$$("h2,h3",content);
    heads.forEach(function(h){
      var li=document.createElement("li");
      var a=document.createElement("a");
      a.href="#"+h.id; a.className=(h.tagName==="H2"?"h2":"h3");
      var txt=h.textContent;
      // pull leading "Part N —" or "① " numbering into a .num badge
      var m=txt.match(/^\s*(Part\s+\d+|[①-⑳])\s*[—·-]?\s*(.*)$/);
      if(m && h.tagName==="H2"){
        a.innerHTML='<span class="num">'+m[1].replace("Part ","P")+'</span>'+m[2];
      }else{
        a.textContent=txt.replace(/^\s*\d+(\.\d+)*\s+/,"");
      }
      a.addEventListener("click",function(){ closeSidebarMobile(); });
      li.appendChild(a); toc.appendChild(li);
    });
    setupScrollSpy(heads);
  }

  function setupScrollSpy(heads){
    if(observer) observer.disconnect();
    var links={};
    $$("#toc a").forEach(function(a){ links[a.getAttribute("href").slice(1)]=a; });
    observer=new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting){
          $$("#toc a.active").forEach(function(a){a.classList.remove("active")});
          var a=links[en.target.id];
          if(a){ a.classList.add("active");
            a.scrollIntoView({block:"nearest"});
          }
        }
      });
    },{rootMargin:"-70px 0px -70% 0px",threshold:0});
    heads.forEach(function(h){observer.observe(h)});
  }

  // ---- diagram zoom modal ----
  var modal=$("#modal"), modalCanvas=$("#modalCanvas"), modalTitle=$("#modalTitle"), zpz=null;
  function openZoom(card){
    var svg=card.querySelector("svg"); if(!svg) return;
    var clone=svg.cloneNode(true);
    clone.removeAttribute("style"); clone.style.maxWidth="none";
    modalCanvas.innerHTML=""; modalCanvas.appendChild(clone);
    modalTitle.textContent=card.querySelector(".tag").textContent+" · drag to pan, scroll to zoom";
    modal.classList.add("open");
    if(zpz){try{zpz.destroy()}catch(e){}}
    zpz=svgPanZoom(clone,{zoomEnabled:true,controlIconsEnabled:false,fit:true,center:true,
      minZoom:0.2,maxZoom:20,zoomScaleSensitivity:0.35,
      onZoom:function(s){ $("#zRead").textContent=Math.round(s*100)+"%"; }});
    setTimeout(function(){ zpz.resize(); zpz.fit(); zpz.center();
      $("#zRead").textContent=Math.round(zpz.getZoom()*100)+"%"; },40);
  }
  function closeZoom(){ modal.classList.remove("open"); if(zpz){try{zpz.destroy()}catch(e){}zpz=null;} modalCanvas.innerHTML=""; }
  function wireDiagramZoom(){
    $$(".diagram",content).forEach(function(card){
      var body=card.querySelector(".dg-body");
      var btn=card.querySelector(".expand");
      body.addEventListener("click",function(){ openZoom(card); });
      btn.addEventListener("click",function(e){ e.stopPropagation(); openZoom(card); });
    });
  }
  $("#zClose").addEventListener("click",closeZoom);
  modal.addEventListener("click",function(e){ if(e.target===modal) closeZoom(); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&modal.classList.contains("open")) closeZoom(); });
  $("#zIn").addEventListener("click",function(){ if(zpz)zpz.zoomIn(); });
  $("#zOut").addEventListener("click",function(){ if(zpz)zpz.zoomOut(); });
  $("#zFit").addEventListener("click",function(){ if(zpz){zpz.resize();zpz.fit();zpz.center();$("#zRead").textContent=Math.round(zpz.getZoom()*100)+"%";} });

  // ---- tabs ----
  $$(".tab").forEach(function(t){
    t.addEventListener("click",function(){
      $$(".tab").forEach(function(x){x.classList.remove("active")});
      t.classList.add("active");
      renderDoc(t.dataset.doc);
    });
  });

  // ---- theme ----
  function applyStoredTheme(){ var s=THEME.read(); if(s) document.documentElement.setAttribute("data-theme",s); }
  applyStoredTheme();
  $("#themeToggle").addEventListener("click",function(){
    var dark=currentDark();
    var next=dark?"light":"dark";
    document.documentElement.setAttribute("data-theme",next);
    THEME.write(next);
    renderMermaid();
  });
  if(window.matchMedia){
    window.matchMedia("(prefers-color-scheme:dark)").addEventListener("change",function(){
      if(!document.documentElement.getAttribute("data-theme")) renderMermaid();
    });
  }

  // ---- toc filter ----
  $("#tocFilter").addEventListener("input",function(e){
    var q=e.target.value.toLowerCase();
    $$("#toc li").forEach(function(li){
      li.hidden = q && li.textContent.toLowerCase().indexOf(q)<0;
    });
  });

  // ---- mobile sidebar ----
  function closeSidebarMobile(){ $("#sidebar").classList.remove("open"); $("#scrim").classList.remove("open"); }
  $("#menuToggle").addEventListener("click",function(){
    $("#sidebar").classList.toggle("open"); $("#scrim").classList.toggle("open");
  });
  $("#scrim").addEventListener("click",closeSidebarMobile);

  // ---- go ----
  renderDoc("masterclass");
})();
</script>
