name: Visual Regression Tests

on:
  push:
    branches: [main]
    paths:
      - 'agent-verse-frontend/src/**'
  pull_request:
    paths:
      - 'agent-verse-frontend/src/**'

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-verse-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agent-verse-frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Start dev server
        run: npm run dev &
        env:
          VITE_API_URL: http://localhost:8000
      - name: Wait for server
        run: npx wait-on http://localhost:5173 --timeout 60000
      - name: Run visual regression tests
        run: CI=true npx playwright test e2e/visual-regression.spec.ts --reporter=html
        env:
          CI: true
      - name: Upload snapshots as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-snapshots-${{ github.sha }}
          path: agent-verse-frontend/e2e/visual-regression.spec.ts-snapshots/
          retention-days: 30
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: agent-verse-frontend/playwright-report/
          retention-days: 7
