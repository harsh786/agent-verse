[project]
name = "agent-verse-backend"
version = "0.1.0"
description = "AgentVerse — vendor-agnostic, multi-tenant operating system for autonomous AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Pine Labs" }]

dependencies = [
    # web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    # database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
    # cache / broker / state
    "redis>=5.2.0",
    "celery[redis]>=5.4.0",
    "celery-redbeat>=2.3.0",
    # CLI
    "typer>=0.12.0",
    # http clients (MCP / A2A / providers)
    "httpx>=0.28.0",
    # crypto (credential vault)
    "cryptography>=44.0.0",
    # SSO (Keycloak JWT validation)
    "python-jose[cryptography]>=3.3.0",
    # observability
    "structlog>=24.4.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29.0",
    "prometheus-client>=0.21.0",
    "anthropic>=0.50.0",
    "langgraph>=0.2.0",
    # scheduling
    "croniter>=1.4.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    # email-to-goal IMAP listener
    "aioimaplib>=1.1",
    # async SMTP for notification service
    "aiosmtplib>=3.0",
    # LangGraph Redis checkpointer for persistent agent state across replicas
    "langgraph-checkpoint-redis>=0.0.1",
    "boto3>=1.40.61",
    "openai>=2.44.0",
    "tiktoken>=0.7.0",
    "pyotp>=2.10.0",
    "qrcode[pil]>=8.2",
    "razorpay>=2.0.1",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.6.0",
    "simpleeval>=1.0.7",
    # Voice OS — native STT + TTS
    "faster-whisper>=1.1.0",
    "soundfile>=0.12.1",
    "numpy>=1.26",
    "kokoro-onnx>=0.3.4",
    "misaki[en]>=0.7.0",
    "fpdf2>=2.7",
    "opentelemetry-instrumentation-httpx>=0.63b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.63b1",
    "opentelemetry-instrumentation-celery>=0.63b1",
    "opentelemetry-instrumentation-asyncpg>=0.63b1",
    "opentelemetry-instrumentation-redis>=0.63b1",
    "opentelemetry-instrumentation-logging>=0.63b1",
]

[project.scripts]
agentverse = "app.cli.main:app"

[project.optional-dependencies]
# LLM providers (install as needed)
voyage = []
gemini = ["google-genai>=1.33.0"]
local-embed = ["sentence-transformers>=3.0.0"]
browser = ["playwright>=1.40.0"]
artifacts = ["aioboto3>=13.0"]
pdf = ["pypdf>=5.0"]
docx = ["python-docx>=1.1"]
multimodal = [
    "pdfminer.six>=20221105",
    "pymupdf>=1.24.0",
    "pillow>=11.0.0"]
colbert = [
    "ragatouille==0.0.9.post2"]
ocr = [
    "pytesseract>=0.3.13",
    "Pillow>=10.0.0",
    "pdf2image>=1.17.0"]

# Install all optional: pip install "agent-verse-backend[voyage,gemini,browser]"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "testcontainers[postgres,redis]>=4.9.0",
    "respx>=0.22.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx2>=2.4.0",
    "asgi-lifespan>=2.1.0",
    "fakeredis>=2.38.0",
    # Optional ingestion-format parsers (app/ingestion/{connectors,parsers}/*.py
    # lazy-import these; tests exercise the real parsing/feed logic, not fakes).
    "feedparser>=6.0.0",
    "openpyxl>=3.1.0",
    "pyarrow>=17.0.0",
    "fastavro>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing"
markers = [
    "integration: tests requiring real Redis/Postgres (testcontainers)",
    "slow: tests that hit real LLM providers (opt-in)",
    "real_openai: tests that call the real OpenAI API (requires OPENAI_API_KEY)",
    "smoke: E2E smoke tests that require a running backend at localhost:8000",
    "e2e_full: full-stack e2e tests booting create_app(manage_pools=True) against real Postgres+Redis (testcontainers or infra/docker-compose.e2e.yml)"]
filterwarnings = [
    "error",
    # Third-party deprecation inside testcontainers wait helpers (out of our control).
    "ignore::DeprecationWarning:testcontainers.*",
    # asyncpg GC cleanup — unclosed connections are harmless in tests (pool teardown timing).
    "ignore::ResourceWarning:asyncpg.*",
    "ignore::ResourceWarning",
    # TODO(hardening): NARROW third-party scope. asyncpg's Connection._cancel coroutine is
    # abandoned during pool teardown (a driver-internal fire-and-forget cancel). This ignore is
    # deliberately keyed to that exact coroutine name so ALL app-code "coroutine was never
    # awaited" bugs still surface as errors (the global ignore that hid P0-1 has been removed).
    "ignore:coroutine 'Connection._cancel' was never awaited:RuntimeWarning",
    # Background asyncio tasks from app startup fire-and-forget patterns (LangGraph checkpoint
    # setup, Redis pub/sub, audit flusher). These are intentional fire-and-forget; the tasks
    # raise when the event loop closes after the test. They are not test failures.
    "ignore::pytest.PytestUnraisableExceptionWarning",
    # governance.pricing.estimate_cost() is deprecated in favour of cost_tracker.calculate_cost().
    # Tests that exercise the legacy function must not fail due to the deprecation warning.
    # Message-based filter: stacklevel=2 means warning is attributed to the caller, not pricing.py.
    "ignore:governance.pricing.estimate_cost.*:DeprecationWarning",
    # God-file decomposition: v1 modules deprecated in favour of their v2/v3 successors.
    # These v1 classes are still wired in main.py and some tests while migration is in progress.
    "ignore:app.governance.audit_v2 is deprecated.*:DeprecationWarning",
    "ignore:app.enterprise.compliance is deprecated.*:DeprecationWarning",
    "ignore:app.enterprise.marketplace is deprecated.*:DeprecationWarning",
    "ignore:app.intelligence.self_optimization is deprecated.*:DeprecationWarning",
    # langgraph-checkpoint-redis's AsyncRedisSaver initialises through redisvl, which emits a
    # DeprecationWarning ("get_async_redis_connection will become async..."). Under
    # filterwarnings=error this aborts async-saver setup and forces a sync RedisSaver fallback
    # whose async methods raise NotImplementedError — breaking inline workflow runs in the
    # e2e harness. Scope-ignore this dependency-internal deprecation so tests exercise the
    # same async checkpointer production uses.
    "ignore:get_async_redis_connection will become async.*:DeprecationWarning"]

[tool.coverage.report]
# Ratchet, not aspiration. Measured true coverage on the fast tier
# (`-m "not integration and not slow and not e2e_full"`) was 75.87%; this floor
# is that value rounded DOWN to the nearest whole percent so a silent regression
# (a deleted test, a whole module going uncovered) trips the gate. Raise it as
# coverage climbs — never lower it to make a red run pass.
fail_under = 75
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
omit = [
    # Alembic auto-generated DDL migrations — SQL schema definitions only.
    "app/db/migrations/*",
    # MCP connector server HTTP wrappers — 300+ thin files each wrapping a
    # different external API. The common dispatch pattern is covered by
    # parametrized tests in tests/mcp/test_servers_comprehensive.py.
    # Individual HTTP bodies need live API keys; belong in integration tests.
    "app/mcp/servers/*"]

[tool.coverage.run]
omit = [
    "app/db/migrations/*",
    "app/mcp/servers/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["A003", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# RUF001/002/003 (ambiguous-unicode-character-*): intentional typographic
# characters — EN DASH used as a prose separator in comments/docstrings, the
# MULTIPLICATION SIGN in analytics docstrings, and (in guardrails_v2/engine.py
# and toxicity.py) literal homoglyph characters that are the anti-spoofing
# guardrail's own detection fixtures and must keep their exact Unicode
# codepoints to do their job. None of these are typos; "fixing" them would
# either read worse in prose or break the guardrail it lives in.
"app/ai_router/shadow_router.py" = ["RUF003"]
"app/api/costs.py" = ["RUF001"]
"app/collab/agent_collab.py" = ["RUF002"]
"app/gateway/notification_router.py" = ["RUF002", "RUF003"]
"app/guardrails_v2/engine.py" = ["RUF001"]
"app/guardrails_v2/toxicity.py" = ["RUF002"]
"app/mcp/servers/brave_search_server.py" = ["RUF001"]
"app/mcp/servers/datadog_server.py" = ["RUF001"]
"app/mcp/servers/insightly_server.py" = ["RUF001"]
"app/mcp/servers/openai_server.py" = ["RUF001"]
"app/mcp/servers/serpapi_server.py" = ["RUF001"]
"app/mcp/servers/tavily_server.py" = ["RUF001"]
"app/mcp/servers/x_twitter_server.py" = ["RUF001"]
"app/mcp/servers/youtube_server.py" = ["RUF001"]
"app/mcp/tool_cache.py" = ["RUF002"]
"app/org/analytics.py" = ["RUF002"]
"app/org/context_engine.py" = ["RUF003"]
"app/org/org_learning.py" = ["RUF003"]
"app/rag/agentic/llm_query_transformer.py" = ["RUF001", "RUF003"]
# E402: app.services.goal_service defines `_svc_logger` and the module-level
# `_GOAL_PAUSE_EVENTS` registry before importing sibling app.agent/app.services
# modules on purpose — some of those modules import back into goal_service
# (circular), and Python only exposes names already bound in a partially
# initialized module during a circular import. Reordering to put all imports
# first would reintroduce that circular-import failure.
"app/services/goal_service.py" = ["E402"]
# Alembic migrations are deployed DDL history — CLAUDE.md/HANDOFF.md convention
# is "never edit a deployed migration; add a new one." These two files trip a
# cosmetic-only rule that isn't already covered by an existing inline noqa
# (a long DDL string literal; a try/except-pass around an idempotent ALTER
# TABLE) — scoped to just these files/codes so it doesn't make every other
# migration's pre-existing per-line `# noqa: E501` comments show as unused.
"app/db/migrations/versions/0031_audit_immutability.py" = ["E501"]
"app/db/migrations/versions/0058_cost_optimization.py" = ["SIM105"]
"app/db/migrations/versions/0055_guardrails.py" = ["RUF003"]

# ── tests/ residual (WS-9) ──────────────────────────────────────────────────
# app/ is ruff-clean (0). tests/ is intentionally lower priority (per WS-9
# scope) and left with a documented residual rather than hand-editing ~6,000
# test files. Every code below was scanned by rule (not blanket-approved) and
# falls into one of these buckets — none indicate a runtime defect on their
# own, with the one flagged exception:
#   - Pure test-fixture/mocking convention, harmless: N806 (`T`/`T1`/`T2` as
#     timestamp shorthand, `MockXxx` local vars holding a class — CapWords is
#     correct for those), N801/N802/N814 (mock class/function names mirroring
#     the production names they stand in for), RUF006 (fire-and-forget tasks
#     in test doubles), RUF012 (mutable class defaults on test-only fixture
#     classes, never shared across a real request lifecycle), A001.
#   - Ambiguous-unicode in test data that must stay byte-exact to test what
#     it tests: RUF001/RUF002/RUF003 (guardrail/PII-detection fixtures using
#     real homoglyphs and typographic dashes, same rationale as the app/
#     per-file-ignores above).
#   - Style-only, no behavior difference either way: E501 (long
#     assert/parametrize/mock-setup lines), E402 (a handful of test files
#     import mid-file after a monkeypatch/fixture setup block), E701/E702
#     (semicolon/colon one-liners in quick fixture setup), SIM101/102/105/
#     108/115/117/118/222 (simplifiable but equivalent control flow),
#     C401/C408/C414, RUF013, RUF015, RUF059, I001, UP036, B007, E741.
#   - Deliberately broad in a handful of tests verifying "any exception
#     surfaces" rather than one specific type: B017.
#   - F841 (~123 unused locals, e.g. `result = await foo(...)` with no
#     following assert): NOT individually audited for a missing assertion —
#     this is the one bucket in this residual worth future scrutiny, since a
#     dropped assert (vs. an intentional "doesn't raise" smoke check) would
#     be a real coverage gap. Flagged here rather than silently ignored so a
#     future pass can `ruff check tests/ --select F841` and review each site.
"tests/**/*.py" = [
    "A001", "B007", "B017", "C401", "C408", "C414", "E402", "E501", "E701",
    "E702", "E741", "F841", "I001", "N801", "N802", "N806", "N814", "RUF001",
    "RUF002", "RUF003", "RUF006", "RUF012", "RUF013", "RUF015", "RUF059",
    "SIM101", "SIM102", "SIM105", "SIM108", "SIM115", "SIM117", "SIM118",
    "SIM222", "UP036",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = false
disallow_untyped_defs = true

# Global: suppress noise from third-party stubs and stale type: ignore comments
[[tool.mypy.overrides]]
module = "app.*"
warn_unused_ignores = false
disable_error_code = [
    "import-untyped",
    "import-not-found",
    "untyped-decorator",
    "no-redef",
    "var-annotated",
    "valid-type",
    "no-untyped-call",
    "no-untyped-def",
    "misc",
    "type-arg",
    "union-attr",
    "no-any-return",
    "dict-item",
    "has-type",
    "call-overload",
    "attr-defined",
    "index",
    "operator",
    "name-defined",
    "list-item",
    "return-value",
    "assignment",
    "override",
    "type-var"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["asyncpg.*", "pgvector.*", "openai.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["PIL.*", "pytesseract.*", "pdf2image.*"]
ignore_missing_imports = true

# Celery tasks: @shared_task decorator is untyped (celery has no py.typed marker)
[[tool.mypy.overrides]]
module = "app.workflow.celery_tasks"
disallow_untyped_decorators = false
warn_return_any = false
no_warn_return_any = true

# LangGraph compiler: StateGraph stubs are incomplete
[[tool.mypy.overrides]]
module = "app.workflow.compiler"
warn_return_any = false
no_warn_return_any = true

# Agent nodes: heavy LangGraph state machine + dynamic tool dispatch.
# These modules work with GraphState (TypedDict) and arbitrary tool
# arguments that are fundamentally Any-typed at the boundary.
# attr-defined: state.context, tool_call.arguments are Any-typed
# type-arg: dict/list without generic params (dynamic state)
[[tool.mypy.overrides]]
module = [
    "app.agent.nodes.executor_mixin",
    "app.agent.nodes.verifier_mixin",
    "app.agent.nodes.planner_mixin",
    "app.agent.nodes.rag_mixin",
    "app.agent.nodes.reasoning_mixin",
    "app.agent.nodes.initialize_mixin",
    "app.agent.nodes.routing_mixin"]
warn_return_any = false
no_warn_return_any = true
disallow_untyped_defs = false
disallow_any_generics = false
disable_error_code = ["attr-defined", "type-arg", "no-any-return", "union-attr", "assignment", "return-value", "index", "operator", "name-defined"]

# Agent graph + loop: LangGraph StateGraph dynamic compilation
[[tool.mypy.overrides]]
module = ["app.agent.graph", "app.agent.loop", "app.agent.state"]
warn_return_any = false
no_warn_return_any = true
disallow_any_generics = false
disable_error_code = ["attr-defined", "type-arg", "no-any-return", "override", "assignment"]

# Celery tasks: sync Redis + dynamic goal execution graph
[[tool.mypy.overrides]]
module = "app.scaling.tasks"
warn_return_any = false
no_warn_return_any = true
disallow_untyped_defs = false
disallow_any_generics = false
disable_error_code = ["attr-defined", "type-arg", "no-any-return", "union-attr", "assignment", "return-value", "index"]

# Ingestion: dynamic parser registry + connector plugins
[[tool.mypy.overrides]]
module = [
    "app.ingestion.scheduler",
    "app.ingestion.parser_registry",
    "app.ingestion.parsers.vision_parser",
    "app.ingestion.parsers.*",
    "app.ingestion.connectors.*"]
warn_return_any = false
no_warn_return_any = true
disallow_untyped_defs = false
disallow_any_generics = false
disable_error_code = ["attr-defined", "type-arg", "no-any-return", "override", "assignment", "return-value"]

# Org OS: dynamic service resolution + event publishing
[[tool.mypy.overrides]]
module = ["app.org.service", "app.org.models", "app.org.router", "app.org.events", "app.org.team_formation"]
warn_return_any = false
no_warn_return_any = true
disallow_untyped_defs = false
disallow_any_generics = false
disable_error_code = ["attr-defined", "type-arg", "no-any-return", "assignment", "return-value", "index"]

# API routers: Pydantic + FastAPI dynamic dependency injection
[[tool.mypy.overrides]]
module = [
    "app.api.enterprise",
    "app.api.ingestion",
    "app.api.civilization",
    "app.api.collab",
    "app.api.tenants",
    "app.api.*"]
warn_return_any = false
no_warn_return_any = true
disallow_any_generics = false
disable_error_code = ["attr-defined", "type-arg", "no-any-return", "assignment", "return-value", "union-attr"]

# LLM providers: third-party SDKs (anthropic, openai) have incomplete stubs
[[tool.mypy.overrides]]
module = [
    "app.providers.anthropic_provider",
    "app.providers.openai_compatible",
    "app.providers.*"]
warn_return_any = false
no_warn_return_any = true
disable_error_code = ["attr-defined", "type-arg", "no-any-return", "assignment", "return-value", "union-attr", "import-untyped"]

# MCP: dynamic connector dispatch + external server schemas
[[tool.mypy.overrides]]
module = [
    "app.mcp.client",
    "app.mcp.tool_intelligence",
    "app.mcp.servers.stripe_server",
    "app.mcp.servers.*",
    "app.gateway.mcp_server",
    "app.mcp.*"]
warn_return_any = false
no_warn_return_any = true
disallow_untyped_defs = false
disallow_any_generics = false
disable_error_code = ["attr-defined", "type-arg", "no-any-return", "assignment", "return-value", "union-attr", "import-untyped"]

# Goal service + event store: dynamic event dispatch + Redis pub/sub
[[tool.mypy.overrides]]
module = ["app.services.*", "app.services.goal_events"]
warn_return_any = false
no_warn_return_any = true
disallow_any_generics = false
disable_error_code = ["attr-defined", "type-arg", "no-any-return", "unused-ignore", "assignment", "return-value", "union-attr"]

# Phase 1: goal_service re-enables call-arg/arg-type (the disconnect-catching codes)
[[tool.mypy.overrides]]
module = "app.services.goal_service"
warn_return_any = false
no_warn_return_any = true
disallow_any_generics = false
disable_error_code = ["attr-defined", "type-arg", "no-any-return", "unused-ignore", "assignment", "return-value", "union-attr"]


# Workflow: LangGraph state machine orchestration
[[tool.mypy.overrides]]
module = ["app.workflow.service", "app.workflow.*", "app.workflow.router_versions"]
warn_return_any = false
no_warn_return_any = true
disallow_any_generics = false
disable_error_code = ["attr-defined", "type-arg", "no-any-return", "assignment", "return-value", "override"]

# Triggers: croniter + dynamic schedule dispatch
[[tool.mypy.overrides]]
module = ["app.triggers.dispatcher", "app.triggers.*"]
warn_return_any = false
no_warn_return_any = true
disallow_untyped_defs = false
disable_error_code = ["attr-defined", "type-arg", "no-any-return", "assignment", "return-value"]

# RPA + Perception: Playwright dynamic page objects
[[tool.mypy.overrides]]
module = ["app.rpa.*", "app.perception.*"]
warn_return_any = false
no_warn_return_any = true
disallow_untyped_defs = false
disable_error_code = ["attr-defined", "type-arg", "no-any-return", "assignment", "return-value", "union-attr"]

# Governance: dynamic policy engine + audit
[[tool.mypy.overrides]]
module = ["app.governance.*"]
warn_return_any = false
no_warn_return_any = true
disallow_any_generics = false
disable_error_code = ["attr-defined", "type-arg", "no-any-return", "assignment", "return-value"]

# Knowledge + RAG: dynamic retrieval + vector ops
[[tool.mypy.overrides]]
module = ["app.knowledge.*", "app.rag.*"]
warn_return_any = false
no_warn_return_any = true
disallow_any_generics = false
disable_error_code = ["attr-defined", "type-arg", "no-any-return", "assignment", "return-value", "override", "union-attr"]

# Reliability: circuit breaker + rollback dynamic dispatch
[[tool.mypy.overrides]]
module = ["app.reliability.*"]
warn_return_any = false
no_warn_return_any = true
disable_error_code = ["attr-defined", "type-arg", "no-any-return", "assignment"]

# Core + config + DB: SQLAlchemy dynamic models
[[tool.mypy.overrides]]
module = ["app.core.*", "app.db.*", "app.tenancy.*", "app.auth.*"]
warn_return_any = false
no_warn_return_any = true
disallow_any_generics = false
disable_error_code = ["attr-defined", "type-arg", "no-any-return", "assignment", "return-value", "union-attr"]

# DB migrations: Alembic op.add_column(Column("x", DateTime, ...)) typing quirk
# (SQLAlchemy's Column() overloads don't line up with how Alembic scripts pass
# already-instantiated type objects) — not real bugs, exclude entirely.
[[tool.mypy.overrides]]
module = ["app.db.migrations.*"]
disable_error_code = ["call-arg", "arg-type", "attr-defined", "type-arg", "assignment"]

# Chat + voice: streaming + WebSocket dynamic content
[[tool.mypy.overrides]]
module = ["app.chat.*", "app.voice.*"]
warn_return_any = false
no_warn_return_any = true
disallow_untyped_defs = false
disable_error_code = ["attr-defined", "type-arg", "no-any-return", "assignment", "return-value"]

# Enterprise + compliance + simulation: dynamic policy evaluation
[[tool.mypy.overrides]]
module = ["app.enterprise.*", "app.compliance.*"]
warn_return_any = false
no_warn_return_any = true
disable_error_code = ["attr-defined", "type-arg", "no-any-return", "assignment", "return-value"]

# Intelligence: eval runner + self-optimizer dynamic LLM calls
[[tool.mypy.overrides]]
module = ["app.intelligence.*"]
warn_return_any = false
no_warn_return_any = true
disallow_untyped_defs = false
disable_error_code = ["attr-defined", "type-arg", "no-any-return", "assignment", "return-value"]

# Observability + analytics: dynamic metric collection
[[tool.mypy.overrides]]
