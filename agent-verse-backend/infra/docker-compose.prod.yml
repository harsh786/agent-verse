# Production docker-compose — all services hardened for production.
# Usage: docker-compose -f docker-compose.prod.yml up -d
name: agentverse-prod

x-common-env: &common-env
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  SECRET_KEY: ${SECRET_KEY}
  ENVIRONMENT: production

  # LLM providers — set at least one
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}

  # SSO / Keycloak
  SSO_ENABLED: ${SSO_ENABLED:-false}
  KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080}
  KEYCLOAK_REALM: ${KEYCLOAK_REALM:-agentverse}
  KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-agentverse-backend}
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}

  # Frontend / CORS
  FRONTEND_URL: ${FRONTEND_URL:-https://app.agentverse.io}
  CORS_ORIGINS: ${CORS_ORIGINS:-https://app.agentverse.io}

  # Object storage (MinIO / S3-compatible)
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-agentverse}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}

  # Email
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_TLS: ${SMTP_TLS:-true}

  # Vault encryption
  AGENTVERSE_VAULT_KEY: ${AGENTVERSE_VAULT_KEY:-}

  # Observability — export traces/metrics to the in-stack otel-collector.
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-agentverse}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentverse}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      <<: *common-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8000"
      - "prometheus.path=/metrics"

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    command: ["celery", "-A", "app.scaling.celery_app", "worker",
              "--loglevel=info", "-Q", "goals,schedules,maintenance,goals_dlq",
              "--concurrency=4", "--max-tasks-per-child=100"]
    environment:
      <<: *common-env
    healthcheck:
      test: ["CMD", "celery", "-A", "app.scaling.celery_app", "inspect", "ping", "-d", "celery@$HOSTNAME", "--timeout=5"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G

  beat:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    command: ["celery", "-A", "app.scaling.celery_app", "beat",
              "--loglevel=info", "--scheduler=redbeat.RedBeatScheduler"]
    environment:
      <<: *common-env
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.scaling.celery_app inspect ping --timeout=5 || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 2
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  grafana:
    image: grafana/grafana:11.0.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-agentverse_admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      - prometheus

  redis-sentinel-1:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      sh -c "echo 'sentinel monitor mymaster redis 6379 2
      sentinel down-after-milliseconds mymaster 5000
      sentinel failover-timeout mymaster 60000
      sentinel parallel-syncs mymaster 1
      bind 0.0.0.0' > /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - redis
    networks:
      - agentverse

  redis-sentinel-2:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      sh -c "echo 'sentinel monitor mymaster redis 6379 2
      sentinel down-after-milliseconds mymaster 5000
      sentinel failover-timeout mymaster 60000
      sentinel parallel-syncs mymaster 1
      bind 0.0.0.0' > /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - redis
    networks:
      - agentverse

  # ── Tracing backbone (always on) ─────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.0
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    environment:
      # Langfuse OTLP fan-out target + Basic auth. Points at the in-stack
      # langfuse-web (only up under the `langfuse` profile) by default; set to
      # Langfuse Cloud to send there instead. The langfuse exporter fails open —
      # the jaeger + prometheus pipelines are unaffected when Langfuse is down.
      LANGFUSE_OTEL_ENDPOINT: ${LANGFUSE_OTEL_ENDPOINT:-http://langfuse-web:3000/api/public/otel}
      LANGFUSE_OTEL_BASIC_AUTH: ${LANGFUSE_OTEL_BASIC_AUTH:-}
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    networks:
      - agentverse
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.58
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    # No host port: the Jaeger UI (16686) has no auth. Reach it inside the network
    # or front it through the reverse proxy / an authenticated ingress in prod.
    networks:
      - agentverse

  # ── Langfuse — LLM-native observability (opt-in: --profile langfuse) ──────────
  # Heavy self-hosted stack; omit and point LANGFUSE_OTEL_ENDPOINT at Langfuse
  # Cloud for a managed setup. Reuses the app's redis; brings its own pg + object
  # store + clickhouse.
  langfuse-minio:
    image: minio/minio:latest
    profiles: ["langfuse"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_MINIO_USER:?set LANGFUSE_MINIO_USER}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD:?set LANGFUSE_MINIO_PASSWORD}
    volumes:
      - langfuse_minio:/data
    networks:
      - agentverse

  langfuse-minio-init:
    image: quay.io/minio/mc:latest
    profiles: ["langfuse"]
    restart: "no"
    entrypoint:
      - sh
      - -c
      - >-
        mc alias set m http://langfuse-minio:9000
        ${LANGFUSE_MINIO_USER:?set LANGFUSE_MINIO_USER} ${LANGFUSE_MINIO_PASSWORD:?set LANGFUSE_MINIO_PASSWORD} &&
        mc mb --ignore-existing m/${LANGFUSE_S3_BUCKET:-langfuse}
    depends_on:
      - langfuse-minio
    networks:
      - agentverse

  langfuse-postgres:
    image: postgres:16-alpine
    profiles: ["langfuse"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:?set LANGFUSE_DB_PASSWORD}
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentverse

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    profiles: ["langfuse"]
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?set LANGFUSE_CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - agentverse

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    profiles: ["langfuse"]
    restart: unless-stopped
    depends_on:
      langfuse-postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      langfuse-minio-init: {condition: service_completed_successfully}
    environment: &langfuse-prod-env
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:?set LANGFUSE_DB_PASSWORD}@langfuse-postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT:?set LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?set LANGFUSE_ENCRYPTION_KEY (64 hex)}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set LANGFUSE_NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3100}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?set LANGFUSE_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_BUCKET:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_USER:?set LANGFUSE_MINIO_USER}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:?set LANGFUSE_MINIO_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
    networks:
      - agentverse

  langfuse-web:
    image: langfuse/langfuse:3
    profiles: ["langfuse"]
    restart: unless-stopped
    depends_on:
      langfuse-worker: {condition: service_started}
      langfuse-postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
    environment:
      <<: *langfuse-prod-env
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-agentverse}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-agentverse}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?set LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:?set LANGFUSE_INIT_PROJECT_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@agentverse.local}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?set LANGFUSE_INIT_USER_PASSWORD}
    # No host port: front langfuse-web through the reverse proxy / authenticated
    # ingress in prod rather than exposing 3000 directly on the host.
    networks:
      - agentverse

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
  langfuse_pgdata:
  clickhouse_data:
  langfuse_minio:

networks:
  agentverse:
    driver: bridge
