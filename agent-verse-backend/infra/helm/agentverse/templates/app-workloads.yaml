{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentverse.fullname" . }}-backend
  labels:
    {{- include "agentverse.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "agentverse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "agentverse.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      containers:
      - name: backend
        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        # NF-16: the image CMD runs `alembic upgrade head` first; the app role
        # cannot run DDL — the migrate Job migrates (as the owner) instead.
        command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
        ports:
        - name: http
          containerPort: 8000
        envFrom:
        - configMapRef:
            name: {{ include "agentverse.fullname" . }}-config
        env:
        {{- include "agentverse.appSecretEnv" . | nindent 8 }}
        # API-only: admin endpoints authenticate with it; no worker needs it.
        - name: PLATFORM_ADMIN_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "agentverse.secretName" . }}
              key: PLATFORM_ADMIN_KEY
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
        resources:
          {{- toYaml .Values.backend.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentverse.fullname" . }}-backend
  labels:
    {{- include "agentverse.labels" . | nindent 4 }}
spec:
  ports:
  - name: http
    port: {{ .Values.backend.service.port }}
    targetPort: http
  selector:
    {{- include "agentverse.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
{{- end }}
---
{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentverse.fullname" . }}-frontend
  labels:
    {{- include "agentverse.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "agentverse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "agentverse.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      containers:
      - name: frontend
        image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        ports:
        - name: http
          containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          {{- toYaml .Values.frontend.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentverse.fullname" . }}-frontend
  labels:
    {{- include "agentverse.labels" . | nindent 4 }}
spec:
  ports:
  - name: http
    port: {{ .Values.frontend.service.port }}
    targetPort: http
  selector:
    {{- include "agentverse.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
{{- end }}
---
{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentverse.fullname" . }}-worker
  labels:
    {{- include "agentverse.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "agentverse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "agentverse.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      containers:
      - name: worker
        image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        command: ["celery"]
        args: ["-A", "app.scaling.celery_app", "worker", "--loglevel=info", "-Q", {{ .Values.worker.queues | quote }}, "--concurrency", {{ .Values.worker.concurrency | quote }}, "--max-tasks-per-child", {{ .Values.worker.maxTasksPerChild | quote }}, "--max-memory-per-child", {{ .Values.worker.maxMemoryPerChildKb | quote }}]
        envFrom:
        - configMapRef:
            name: {{ include "agentverse.fullname" . }}-config
        env:
        {{- include "agentverse.appSecretEnv" . | nindent 8 }}
        - name: WORKER_PRELOAD_RETRIEVAL_MODELS
          value: {{ .Values.worker.preloadRetrievalModels | quote }}
        resources:
          {{- toYaml .Values.worker.resources | nindent 10 }}
{{- end }}
---
{{- /*
  Dedicated pool for supervisor sub-goals (CORE-09): a supervisor parent holds its
  worker slot while it waits, so its sub-goals (goals.subgoals.{plan}) are consumed
  only by this pool and can never queue behind their own parent.
*/}}
{{- if .Values.subgoalWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentverse.fullname" . }}-subgoal-worker
  labels:
    {{- include "agentverse.labels" . | nindent 4 }}
    app.kubernetes.io/component: subgoal-worker
spec:
  replicas: {{ .Values.subgoalWorker.replicaCount }}
  selector:
    matchLabels:
      {{- include "agentverse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: subgoal-worker
  template:
    metadata:
      labels:
        {{- include "agentverse.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: subgoal-worker
    spec:
      containers:
      - name: subgoal-worker
        image: "{{ .Values.subgoalWorker.image.repository }}:{{ .Values.subgoalWorker.image.tag }}"
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        command: ["celery"]
        args: ["-A", "app.scaling.celery_app", "worker", "--loglevel=info", "-Q", {{ .Values.subgoalWorker.queues | quote }}, "--concurrency", {{ .Values.subgoalWorker.concurrency | quote }}, "--max-tasks-per-child", {{ .Values.subgoalWorker.maxTasksPerChild | quote }}, "--max-memory-per-child", {{ .Values.subgoalWorker.maxMemoryPerChildKb | quote }}]
        envFrom:
        - configMapRef:
            name: {{ include "agentverse.fullname" . }}-config
        env:
        {{- include "agentverse.appSecretEnv" . | nindent 8 }}
        - name: WORKER_PRELOAD_RETRIEVAL_MODELS
          value: {{ .Values.subgoalWorker.preloadRetrievalModels | quote }}
        resources:
          {{- toYaml .Values.subgoalWorker.resources | nindent 10 }}
{{- end }}
---
{{- if .Values.beat.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentverse.fullname" . }}-beat
  labels:
    {{- include "agentverse.labels" . | nindent 4 }}
    app.kubernetes.io/component: beat
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "agentverse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: beat
  template:
    metadata:
      labels:
        {{- include "agentverse.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: beat
    spec:
      containers:
      - name: beat
        image: "{{ .Values.beat.image.repository }}:{{ .Values.beat.image.tag }}"
        command: ["celery"]
        args: ["-A", "app.scaling.celery_app", "beat", "--loglevel=info"]
        envFrom:
        - configMapRef:
            name: {{ include "agentverse.fullname" . }}-config
        env:
        {{- include "agentverse.appSecretEnv" . | nindent 8 }}
        resources:
          {{- toYaml .Values.beat.resources | nindent 10 }}
{{- end }}
