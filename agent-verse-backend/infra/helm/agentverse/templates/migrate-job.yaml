{{- /*
  NF-16: migrations run as the schema OWNER here — never in an app workload —
  and alembic's env.py then creates/repairs the least-privilege application role
  (APP_DB_USER) with grants on every table (app/db/app_role.py). A new Job per
  release revision (Jobs are immutable); app pods connecting as the app role
  retry until it exists. Not a helm hook: a pre-install hook would run before
  the bundled Postgres exists, and a post-install one deadlocks `helm --wait`.
*/}}
{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agentverse.fullname" . }}-db-migrate-{{ .Release.Revision }}
  labels:
    {{- include "agentverse.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-migrate
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "agentverse.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: db-migrate
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      containers:
      - name: db-migrate
        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        command: ["alembic", "upgrade", "head"]
        envFrom:
        - configMapRef:
            name: {{ include "agentverse.fullname" . }}-config
        env:
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "agentverse.secretName" . }}
              key: DATABASE_PASSWORD
        - name: MIGRATION_DATABASE_URL
          value: postgresql+asyncpg://{{ .Values.postgresql.username }}:$(DATABASE_PASSWORD)@{{ include "agentverse.postgresHost" . }}:{{ .Values.postgresql.service.port }}/{{ .Values.postgresql.database }}
        - name: APP_DB_USER
          value: {{ .Values.postgresql.appUsername | quote }}
        - name: APP_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "agentverse.secretName" . }}
              key: APP_DB_PASSWORD
        - name: DATABASE_URL
          value: postgresql+asyncpg://{{ .Values.postgresql.appUsername }}:$(APP_DB_PASSWORD)@{{ include "agentverse.postgresHost" . }}:{{ .Values.postgresql.service.port }}/{{ .Values.postgresql.database }}
        resources:
          {{- toYaml .Values.migrations.resources | nindent 10 }}
{{- end }}
