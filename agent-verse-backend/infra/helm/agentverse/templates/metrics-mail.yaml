{{- if .Values.prometheus.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "agentverse.fullname" . }}-prometheus
  labels:
    {{- include "agentverse.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  serviceName: {{ include "agentverse.fullname" . }}-prometheus
  replicas: 1
  selector:
    matchLabels:
      {{- include "agentverse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      labels:
        {{- include "agentverse.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: prometheus
    spec:
      initContainers:
      - name: fix-permissions
        image: busybox:1.36
        command: ["sh", "-c", "mkdir -p /prometheus && chown -R 65534:65534 /prometheus"]
        volumeMounts:
        - name: data
          mountPath: /prometheus
      containers:
      - name: prometheus
        image: {{ .Values.prometheus.image | quote }}
        securityContext:
          runAsUser: 65534
          runAsGroup: 65534
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --web.enable-lifecycle
        ports:
        - name: http
          containerPort: 9090
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: data
          mountPath: /prometheus
      volumes:
      - name: config
        configMap:
          name: {{ include "agentverse.fullname" . }}-prometheus
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "agentverse.fullname" . }}-prometheus
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentverse.fullname" . }}-prometheus
  labels:
    {{- include "agentverse.labels" . | nindent 4 }}
spec:
  ports:
  - name: http
    port: {{ .Values.prometheus.service.port }}
    targetPort: http
  selector:
    {{- include "agentverse.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
{{- end }}
---
{{- if .Values.otel.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentverse.fullname" . }}-otel
  labels:
    {{- include "agentverse.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "agentverse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: otel
  template:
    metadata:
      labels:
        {{- include "agentverse.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: otel
    spec:
      containers:
      - name: otel
        image: {{ .Values.otel.image | quote }}
        args: ["--config=/etc/otel/otel.yml"]
        ports:
        - name: otlp-grpc
          containerPort: 4317
        - name: otlp-http
          containerPort: 4318
        - name: metrics
          containerPort: 8889
        volumeMounts:
        - name: config
          mountPath: /etc/otel
      volumes:
      - name: config
        configMap:
          name: {{ include "agentverse.fullname" . }}-otel
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentverse.fullname" . }}-otel
  labels:
    {{- include "agentverse.labels" . | nindent 4 }}
spec:
  ports:
  - name: otlp-grpc
    port: 4317
    targetPort: otlp-grpc
  - name: otlp-http
    port: 4318
    targetPort: otlp-http
  - name: metrics
    port: 8889
    targetPort: metrics
  selector:
    {{- include "agentverse.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: otel
{{- end }}
---
{{- if .Values.mailpit.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentverse.fullname" . }}-mailpit
  labels:
    {{- include "agentverse.labels" . | nindent 4 }}
    app.kubernetes.io/component: mailpit
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "agentverse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mailpit
  template:
    metadata:
      labels:
        {{- include "agentverse.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mailpit
    spec:
      containers:
      - name: mailpit
        image: {{ .Values.mailpit.image | quote }}
        ports:
        - name: smtp
          containerPort: 1025
        - name: http
          containerPort: 8025
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentverse.fullname" . }}-mailpit
  labels:
    {{- include "agentverse.labels" . | nindent 4 }}
spec:
  ports:
  - name: smtp
    port: 1025
    targetPort: smtp
  - name: http
    port: 8025
    targetPort: http
  selector:
    {{- include "agentverse.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mailpit
{{- end }}
