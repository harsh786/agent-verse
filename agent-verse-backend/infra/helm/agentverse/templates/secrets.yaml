{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentverse.secretName" . }}
  labels:
    {{- include "agentverse.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Schema owner: the migrate Job only (and the bundled Postgres itself).
  DATABASE_PASSWORD: {{ .Values.secrets.databasePassword | quote }}
  # NF-16: the least-privilege application role every app workload connects as.
  APP_DB_PASSWORD: {{ .Values.secrets.appDatabasePassword | quote }}
  # NF-16: the BYPASSRLS maintenance role (default: the owner's password).
  MAINTENANCE_DB_PASSWORD: {{ .Values.secrets.maintenanceDatabasePassword | default .Values.secrets.databasePassword | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  MINIO_ACCESS_KEY: {{ .Values.secrets.minioRootUser | quote }}
  MINIO_SECRET_KEY: {{ .Values.secrets.minioRootPassword | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  VAULT_MASTER_KEY: {{ .Values.secrets.vaultMasterKey | quote }}
  # Comma-separated previous master keys, only during `agentverse vault-rotate`.
  VAULT_PREVIOUS_MASTER_KEYS: {{ .Values.secrets.vaultPreviousMasterKeys | default "" | quote }}
  GOAL_TOKEN_SECRET: {{ .Values.secrets.goalTokenSecret | quote }}
  MANIFEST_SIGNING_SECRET: {{ .Values.secrets.manifestSigningSecret | quote }}
  PLATFORM_ADMIN_KEY: {{ .Values.secrets.platformAdminKey | quote }}
  A2A_SHARED_SECRET: {{ .Values.secrets.a2aSharedSecret | default "" | quote }}
  # NF-15: optional, shared by the API and every worker (empty = not configured).
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | default "" | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | default "" | quote }}
  VOYAGE_API_KEY: {{ .Values.secrets.voyageApiKey | default "" | quote }}
  GOOGLE_API_KEY: {{ .Values.secrets.googleApiKey | default "" | quote }}
  SMTP_USER: {{ .Values.secrets.smtpUser | default "" | quote }}
  SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | default "" | quote }}
{{- end }}
