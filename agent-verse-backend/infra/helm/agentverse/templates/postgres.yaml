{{- if .Values.postgresql.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "agentverse.fullname" . }}-postgres
  labels:
    {{- include "agentverse.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "agentverse.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "agentverse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "agentverse.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
      - name: postgres
        image: {{ .Values.postgresql.image | quote }}
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        ports:
        - name: postgres
          containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: {{ .Values.postgresql.username | quote }}
        - name: POSTGRES_DB
          value: {{ .Values.postgresql.database | quote }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "agentverse.secretName" . }}
              key: DATABASE_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", {{ .Values.postgresql.username | quote }}]
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          {{- toYaml .Values.postgresql.resources | nindent 10 }}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "agentverse.fullname" . }}-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentverse.fullname" . }}-postgres
  labels:
    {{- include "agentverse.labels" . | nindent 4 }}
spec:
  ports:
  - name: postgres
    port: {{ .Values.postgresql.service.port }}
    targetPort: postgres
  selector:
    {{- include "agentverse.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
{{- end }}
