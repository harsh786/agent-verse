# AgentVerse one-click Kubernetes deployment values.
# Minikube quick start:
#   eval $(minikube docker-env)
#   docker build -t agentverse/backend:local ../../
#   docker build -t agentverse/frontend:local ../../../agent-verse-frontend
#   helm upgrade --install agentverse ./agentverse -n agentverse --create-namespace -f values.yaml

global:
  imagePullSecrets: []
  storageClassName: ""

localStaticPVs:
  enabled: false
  storageClassName: agentverse-local
  pathPrefix: /data/agentverse

externalServices:
  postgresHost: ""
  redisHost: ""
  minioEndpoint: ""

imagePullPolicy: IfNotPresent

secrets:
  create: true
  databasePassword: agentverse
  redisPassword: agentverse-redis
  minioRootUser: minioadmin
  minioRootPassword: minioadmin
  jwtSecret: change-me-jwt
  vaultMasterKey: change-me-vault-master-key-min-32-chars
  goalTokenSecret: change-me-goal-token
  manifestSigningSecret: change-me-manifest
  platformAdminKey: change-me-admin-key

backend:
  enabled: true
  replicaCount: 1
  image:
    repository: agentverse/backend
    tag: local
  service:
    port: 8000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  env:
    ENVIRONMENT: production
    MANAGE_POOLS: "true"
    CORS_ORIGINS: http://agentverse.local,http://localhost:8080
    FRONTEND_URL: http://agentverse.local
    OTEL_EXPORTER_OTLP_ENDPOINT: http://agentverse-otel:4317
    OTEL_SERVICE_NAME: agentverse-backend
    MINIO_BUCKET: agentverse-artifacts

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: agentverse/frontend
    tag: local
  service:
    port: 80
  env:
    VITE_API_URL: /api
    VITE_GRAFANA_URL: /grafana
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

worker:
  enabled: true
  replicaCount: 1
  image:
    repository: agentverse/backend
    tag: local
  concurrency: 4
  queues: goals,goals.free,goals.starter,goals.professional,goals.enterprise,schedules,maintenance,goals_dlq
  resources:
    requests:
      cpu: 500m
      memory: 768Mi
    limits:
      cpu: "2"
      memory: 2Gi

beat:
  enabled: true
  image:
    repository: agentverse/backend
    tag: local
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

postgresql:
  enabled: true
  image: pgvector/pgvector:pg16
  username: agentverse
  database: agentverse
  service:
    port: 5432
  persistence:
    enabled: true
    size: 20Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

redis:
  enabled: true
  image: redis:7-alpine
  service:
    port: 6379
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

minio:
  enabled: true
  image: minio/minio:RELEASE.2024-07-16T23-46-41Z
  persistence:
    enabled: true
    size: 20Gi
    storageClassName: ""
  service:
    apiPort: 9000
    consolePort: 9001

kong:
  enabled: true
  image: kong:3.7
  ingressClassName: kong
  service:
    type: NodePort
    proxyPort: 80
    nodePort: 30080
    adminPort: 8001
  plugins:
    cors: true
    requestSizeLimit: true
    rateLimiting: false

loki:
  enabled: true
  image: grafana/loki:2.9.8
  service:
    port: 3100
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: ""

promtail:
  enabled: true
  image: grafana/promtail:2.9.8

grafana:
  enabled: true
  image: grafana/grafana:10.4.0
  adminUser: admin
  adminPassword: agentverse
  service:
    port: 3000
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: ""

prometheus:
  enabled: true
  image: prom/prometheus:v2.51.0
  service:
    port: 9090
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: ""

otel:
  enabled: true
  image: otel/opentelemetry-collector-contrib:0.103.0

mailpit:
  enabled: true
  image: axllent/mailpit:latest

backup:
  enabled: true
  schedule: "0 2 * * *"
  existingPVC: ""
