# AgentVerse one-click Kubernetes deployment values.
# Minikube quick start:
#   eval $(minikube docker-env)
#   docker build -t agentverse/backend:local ../../
#   docker build -t agentverse/frontend:local ../../../agent-verse-frontend
#   helm upgrade --install agentverse ./agentverse -n agentverse --create-namespace -f values.yaml

global:
  imagePullSecrets: []
  storageClassName: ""

localStaticPVs:
  enabled: false
  storageClassName: agentverse-local
  pathPrefix: /data/agentverse

externalServices:
  postgresHost: ""
  redisHost: ""
  minioEndpoint: ""

imagePullPolicy: IfNotPresent

secrets:
  create: true
  databasePassword: agentverse
  appDatabasePassword: change-me-app-db-password
  # Empty = databasePassword (the maintenance role defaults to the owner).
  maintenanceDatabasePassword: ""
  redisPassword: agentverse-redis
  minioRootUser: minioadmin
  minioRootPassword: minioadmin
  jwtSecret: change-me-jwt
  vaultMasterKey: change-me-vault-master-key-min-32-chars
  # Set (comma-separated) only while `agentverse vault-rotate` re-encrypts.
  vaultPreviousMasterKeys: ""
  goalTokenSecret: change-me-goal-token
  manifestSigningSecret: change-me-manifest
  platformAdminKey: change-me-admin-key
  # Optional platform LLM / embedding keys and SMTP credentials (NF-15): every
  # app workload (API, workers, beat) gets the same values.
  anthropicApiKey: ""
  openaiApiKey: ""
  voyageApiKey: ""
  googleApiKey: ""
  smtpUser: ""
  smtpPassword: ""

# DEF-NEW-1: public HTTPS base URL of the messaging gateway (GATEWAY_PUBLIC_BASE_URL),
# e.g. "https://agents.example.com" (optional path prefix). With it the server
# registers Telegram bindings with setWebhook and returns absolute channel callback
# URLs; empty = tenants register their webhooks by hand. https only (anything else
# is treated as unset). Rendered into the shared config map (API + workers + beat).
gateway:
  publicBaseUrl: ""

# EGRESS-CFG: connector egress escape hatch — OPERATOR-ONLY, never tenant-settable.
# Connectors refuse private / loopback / link-local / metadata addresses. To let them
# reach your own internal infrastructure (e.g. a MinIO on 192.168.63.104) set
# allowInternalSources: true AND list each host in internalSourceAllowlist
# (comma-separated hostnames or IP literals, e.g. "192.168.63.104,minio.internal").
# The list alone does nothing. Rendered into the shared config map, so the API and
# every worker / beat enforce the same policy.
ingestion:
  allowInternalSources: false
  internalSourceAllowlist: ""
  # Private / internal hosts and IPs for ingestion, connectors and model
  # endpoints (cloud metadata / link-local still blocked). false = public only.
  allowPrivateNetworkAccess: true

# OCR-PAR: OCR parallelism, one bounded pool per process shared by every document
# (uploads, /ocr, ZIP members, ingestion jobs). maxConcurrency = OCR threads and
# page bitmaps in flight per process (0 = the pod's CPU limit / quota, split
# between a prefork worker's children); pageConcurrency = pages of ONE document at
# once (0 = maxConcurrency - 1, min 2); visionConcurrency = LLM-vision fallback
# calls in flight; renderDpi = scanned-page rasterisation; ompThreadLimit pins
# tesseract's OpenMP threads (pages already run in parallel). Rendered into the
# shared config map, so the API and every worker use the same limits.
# Model Registry: tenants whose ADMIN users may change the deployment-wide model
# registry (models, catalog import, preference order) without the platform admin
# key. Comma-separated tenant ids; "*" = any tenant's admins (single-tenant
# deployments). Empty = any tenant admin outside production; production then
# accepts only the platform admin key.
platformAdminTenantIds: ""

ocr:
  # false (default) = skip Tesseract; the LLM-vision OCR model reads every page.
  # true = Tesseract first, LLM vision only for low-confidence pages.
  tesseractEnabled: false
  maxConcurrency: 0
  pageConcurrency: 0
  visionConcurrency: 4
  renderDpi: 300
  ompThreadLimit: 1

backend:
  enabled: true
  replicaCount: 1
  image:
    repository: agentverse/backend
    tag: local
  service:
    port: 8000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  env:
    ENVIRONMENT: production
    MANAGE_POOLS: "true"
    CORS_ORIGINS: http://agentverse.local,http://localhost:8080
    FRONTEND_URL: http://agentverse.local
    OTEL_EXPORTER_OTLP_ENDPOINT: http://agentverse-otel:4317
    OTEL_SERVICE_NAME: agentverse-backend
    MINIO_BUCKET: agentverse-artifacts

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: agentverse/frontend
    tag: local
  service:
    port: 80
  env:
    VITE_API_URL: /api
    VITE_GRAFANA_URL: /grafana
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

# Worker memory budget (owner decision D4, same numbers as L-03 in
# infra/docker-compose.prod.yml and infra/k8s/worker-deployment.yaml):
#   concurrency 4 processes per pod; scale throughput with replicas (pods), not
#   with concurrency.
#   maxMemoryPerChildKb 700000 (700 MB) -- Celery recycles a child after a task
#   once its RSS passes this; a child that has reranked needs ~600 MB, so it is
#   not recycled after every search.
#   limit 3.5Gi (3584 Mi) >= parent ~300 MB + 4 x (700 MB cap + ~100 MB one-task
#   overshoot) = 3500 MB. Enforced by tests/scaling/test_worker_memory_budget.py.
#   preloadRetrievalModels false -- children load torch/the cross-encoder lazily
#   on first use instead of every child paying ~450 MB at start (L-03).
worker:
  enabled: true
  replicaCount: 1
  image:
    repository: agentverse/backend
    tag: local
  concurrency: 4
  maxTasksPerChild: 100
  maxMemoryPerChildKb: 700000
  preloadRetrievalModels: false
  queues: celery,goals,goals.free,goals.starter,goals.professional,goals.enterprise,goals_dlq,schedules,triggers.poll,ingestion,workflows.free,workflows.starter,workflows.professional,workflows.enterprise,workflows.maintenance
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 3.5Gi  # D4 / L-03 budget, see the comment above `worker:`

# Dedicated pool for supervisor sub-goals (CORE-09). `worker.queues` must NOT
# list these queues: a supervisor parent holds its worker slot while it waits, so
# its sub-goals need slots the parents can never occupy. Same D4 / L-03 memory
# budget as `worker` (4 processes, 700 MB per child, 3.5Gi per pod).
subgoalWorker:
  enabled: true
  replicaCount: 1
  image:
    repository: agentverse/backend
    tag: local
  concurrency: 4
  maxTasksPerChild: 100
  maxMemoryPerChildKb: 700000
  preloadRetrievalModels: false
  queues: goals.subgoals.free,goals.subgoals.starter,goals.subgoals.professional,goals.subgoals.enterprise
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 3.5Gi  # D4 / L-03 budget

# Dedicated pool for the beat's housekeeping (GAP-WORKER): maintenance +
# governance. `worker.queues` does NOT list these queues (beat ticks queued by
# the thousand behind running goals on the shared pool), so this pool must be
# enabled wherever `worker` is.
maintenanceWorker:
  enabled: true
  replicaCount: 2
  image:
    repository: agentverse/backend
    tag: local
  concurrency: 2
  maxTasksPerChild: 200
  maxMemoryPerChildKb: 700000
  queues: maintenance,governance
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 2Gi  # L-03 budget: 300 MB + 2 x (700 MB cap + 100 MB)

# Dedicated pool for the time triggers (B1-4); `worker` also consumes these queues.
scheduleWorker:
  enabled: true
  replicaCount: 2
  image:
    repository: agentverse/backend
    tag: local
  concurrency: 2
  maxTasksPerChild: 200
  maxMemoryPerChildKb: 700000
  queues: schedules,triggers.poll
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 2Gi  # L-03 budget: 300 MB + 2 x (700 MB cap + 100 MB)

beat:
  enabled: true
  image:
    repository: agentverse/backend
    tag: local
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

postgresql:
  enabled: true
  image: pgvector/pgvector:pg16
  # Schema owner: migrations run as it (migrate Job only).
  username: agentverse
  # NF-16: least-privilege application role (NOSUPERUSER, NOBYPASSRLS) the API,
  # workers and beat connect as; the migrate Job creates/repairs it.
  appUsername: agentverse_app
  # NF-16: BYPASSRLS role for cross-tenant system jobs; empty = the owner.
  maintenanceUsername: ""
  database: agentverse
  service:
    port: 5432
  persistence:
    enabled: true
    size: 20Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

redis:
  enabled: true
  # redis-stack-server, NOT plain redis: the LangGraph AsyncRedisSaver
  # checkpointer needs the RediSearch module. Without it the app silently falls
  # back to an in-process MemorySaver and cross-replica agent state is lost --
  # which is precisely what a Helm (multi-replica) deployment cannot tolerate.
  image: redis/redis-stack-server:7.4.0-v0
  service:
    port: 6379
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

minio:
  enabled: true
  image: minio/minio:RELEASE.2024-07-16T23-46-41Z
  persistence:
    enabled: true
    size: 20Gi
    storageClassName: ""
  service:
    apiPort: 9000
    consolePort: 9001

kong:
  enabled: true
  image: kong:3.7
  ingressClassName: kong
  service:
    type: NodePort
    proxyPort: 80
    nodePort: 30080
    adminPort: 8001
  plugins:
    cors: true
    requestSizeLimit: true
    rateLimiting: false

loki:
  enabled: true
  image: grafana/loki:2.9.8
  service:
    port: 3100
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: ""

promtail:
  enabled: false
  image: grafana/promtail:2.9.8
  scrapeMode: synthetic # synthetic for Minikube smoke, pods for production

lokiSmoke:
  enabled: true
  image: curlimages/curl:8.10.1

grafana:
  enabled: true
  image: grafana/grafana:10.4.0
  adminUser: admin
  adminPassword: agentverse
  service:
    port: 3000
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: ""

prometheus:
  enabled: true
  image: prom/prometheus:v2.51.0
  service:
    port: 9090
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: ""

otel:
  enabled: true
  image: otel/opentelemetry-collector-contrib:0.103.0

# Langfuse — LLM-native observability (traces/generations/sessions/cost). The otel
# collector fans the SAME spans out to Langfuse over OTLP/HTTP when enabled. Langfuse
# itself is NOT deployed by this chart (it is a heavy 4-service stack); run it either
# via the official langfuse-k8s Helm chart in-cluster, or use Langfuse Cloud — then
# point otlp.endpoint/basicAuth here. Off by default.
langfuse:
  enabled: false
  otlp:
    # e.g. https://cloud.langfuse.com/api/public/otel (Cloud) or
    # http://langfuse-web.langfuse.svc:3000/api/public/otel (self-hosted in-cluster).
    endpoint: ""
    # "Basic <base64(publicKey:secretKey)>". Prefer sourcing from a Secret in prod.
    basicAuth: ""

mailpit:
  enabled: true
  image: axllent/mailpit:latest

backup:
  enabled: true
  schedule: "0 2 * * *"
  existingPVC: ""

# NF-16: one-shot Job per install/upgrade (named by release revision): migrates
# as the schema owner, then creates/repairs postgresql.appUsername with grants.
# App pods wait in an initContainer until the schema is at this image's head.
migrations:
  enabled: true
  backoffLimit: 20
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
