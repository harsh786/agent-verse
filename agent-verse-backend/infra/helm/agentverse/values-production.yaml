# Production overlay. Secrets should be provided by ExternalSecrets/SealedSecrets
# or GitHub environment secrets passed at deploy time.

imagePullPolicy: IfNotPresent

backend:
  replicaCount: 3
  image:
    repository: ghcr.io/harsh786/agentverse-backend
    tag: latest
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  env:
    ENVIRONMENT: production
    MANAGE_POOLS: "true"
    CORS_ORIGINS: https://app.agentverse.example.com
    FRONTEND_URL: https://app.agentverse.example.com
    OTEL_EXPORTER_OTLP_ENDPOINT: http://agentverse-agentverse-otel:4317
    OTEL_SERVICE_NAME: agentverse-backend

frontend:
  replicaCount: 3
  image:
    repository: ghcr.io/harsh786/agentverse-frontend
    tag: latest

worker:
  replicaCount: 3
  image:
    repository: ghcr.io/harsh786/agentverse-backend
    tag: latest
  concurrency: 8

beat:
  image:
    repository: ghcr.io/harsh786/agentverse-backend
    tag: latest

kong:
  service:
    type: LoadBalancer
    nodePort: null

postgresql:
  persistence:
    size: 200Gi
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 8Gi

redis:
  persistence:
    size: 50Gi

minio:
  persistence:
    size: 500Gi

loki:
  persistence:
    size: 100Gi

grafana:
  persistence:
    size: 20Gi

prometheus:
  persistence:
    size: 100Gi

promtail:
  enabled: true
  scrapeMode: pods

lokiSmoke:
  enabled: false
