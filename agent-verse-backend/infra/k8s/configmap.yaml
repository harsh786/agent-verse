apiVersion: v1
kind: ConfigMap
metadata:
  name: agentverse-config
  namespace: agentverse
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  APP_NAME: "AgentVerse"
  SERVICE_NAME: "agentverse"
  CORS_ORIGINS: "https://app.agentverse.ai"
  # pgBouncer connection pool URL (used by the backend instead of direct Postgres)
  DATABASE_URL_PGBOUNCER: "postgresql+asyncpg://agentverse:CHANGE_ME@pgbouncer:5432/agentverse"
  # OpenTelemetry
  OTEL_SERVICE_NAME: "agentverse"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  # Connector egress escape hatch (operator-only, never tenant-settable). Every app
  # workload (API, workers, beat) reads this one ConfigMap, so ingestion on the API
  # and on the workers enforce the same policy. To allow your own internal sources
  # (e.g. a MinIO on a private IP) set the flag to "true" AND list the hosts
  # (hostnames or IP literals, comma-separated); the list alone does nothing.
  # Enforced by tests/infra/test_vault_key_distribution.py (EGRESS-CFG).
  INGESTION_ALLOW_INTERNAL_SOURCES: "false"
  INGESTION_INTERNAL_SOURCE_ALLOWLIST: ""
