apiVersion: v1
kind: ConfigMap
metadata:
  name: agentverse-config
  namespace: agentverse
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  APP_NAME: "AgentVerse"
  SERVICE_NAME: "agentverse"
  CORS_ORIGINS: "https://app.agentverse.ai"
  # pgBouncer connection pool URL (used by the backend instead of direct Postgres)
  DATABASE_URL_PGBOUNCER: "postgresql+asyncpg://agentverse:CHANGE_ME@pgbouncer:5432/agentverse"
  # OpenTelemetry
  OTEL_SERVICE_NAME: "agentverse"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  # Messaging gateway public HTTPS base URL (DEF-NEW-1), e.g.
  # "https://agents.example.com": Telegram bindings are registered with setWebhook
  # and channel callback URLs are absolute. Empty = register webhooks by hand.
  # https only. Enforced by tests/infra/test_vault_key_distribution.py.
  GATEWAY_PUBLIC_BASE_URL: ""
  # Connector egress escape hatch (operator-only, never tenant-settable). Every app
  # workload (API, workers, beat) reads this one ConfigMap, so ingestion on the API
  # and on the workers enforce the same policy. To allow your own internal sources
  # (e.g. a MinIO on a private IP) set the flag to "true" AND list the hosts
  # (hostnames or IP literals, comma-separated); the list alone does nothing.
  # Enforced by tests/infra/test_vault_key_distribution.py (EGRESS-CFG).
  INGESTION_ALLOW_INTERNAL_SOURCES: "false"
  INGESTION_INTERNAL_SOURCE_ALLOWLIST: ""
  # OCR-PAR: OCR parallelism, one bounded pool per process shared by every document.
  # "0" = the pod's CPU limit (cgroup quota), split between a prefork worker's
  # children; page concurrency "0" = max - 1 (min 2). OMP_THREAD_LIMIT pins
  # tesseract's OpenMP threads (pages already run in parallel).
  OCR_MAX_CONCURRENCY: "0"
  OCR_PAGE_CONCURRENCY: "0"
  OCR_VISION_CONCURRENCY: "4"
  OCR_RENDER_DPI: "300"
  OMP_THREAD_LIMIT: "1"
