apiVersion: batch/v1
kind: CronJob
metadata:
  name: agentverse-pg-backup
  namespace: agentverse
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: pg-backup
            image: postgres:16-alpine
            command:
            - /bin/sh
            - -c
            - |
              FILENAME="agentverse-$(date +%Y%m%d-%H%M%S).sql.gz"
              # NF-16: DATABASE_URL is the RLS-bound app role (pg_dump would
              # refuse the RLS tables); dump as the BYPASSRLS maintenance role.
              # libpq does not know the SQLAlchemy "+asyncpg" scheme.
              DSN=$(printf '%s' "$MAINTENANCE_DATABASE_URL" | sed 's#^postgresql+asyncpg://#postgresql://#')
              set -o pipefail
              pg_dump "$DSN" | gzip > /tmp/$FILENAME
              echo "Backup: $FILENAME ($(du -h /tmp/$FILENAME | cut -f1))"
            envFrom:
            - secretRef:
                name: agentverse-secrets
