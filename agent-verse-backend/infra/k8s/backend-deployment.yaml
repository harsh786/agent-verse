apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentverse-backend
  namespace: agentverse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agentverse-backend
  template:
    metadata:
      labels:
        app: agentverse-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: backend
          image: agentverse-backend:latest
          ports:
            - containerPort: 8000
          # NF-16: the image CMD migrates first; this least-privilege app role
          # cannot run DDL — the PreSync migration Job does it as the owner.
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
          envFrom:
            - configMapRef:
                name: agentverse-config
            - secretRef:
                name: agentverse-secrets
          # NF-16: DATABASE_URL (the least-privilege APP role, via pgBouncer) and
          # MAINTENANCE_DATABASE_URL (BYPASSRLS, cross-tenant system jobs) come
          # from agentverse-secrets like every other app workload. This used to
          # override DATABASE_URL with the schema OWNER, which bypasses RLS.
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
