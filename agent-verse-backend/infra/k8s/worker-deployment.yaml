apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentverse-worker
  namespace: agentverse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agentverse-worker
  template:
    metadata:
      labels:
        app: agentverse-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9540"
        prometheus.io/path: "/metrics"
    spec:
      # NF-16: wait in Init — not CrashLoopBackOff — until the migration Job has
      # brought the schema (read as the app role) to this image's alembic head.
      initContainers:
        - name: wait-for-schema
          image: agentverse-backend:latest
          command: ["python", "-m", "app.db.wait_for_schema"]
          envFrom:
            - configMapRef:
                name: agentverse-config
            - secretRef:
                name: agentverse-secrets
      containers:
        - name: worker
          image: agentverse-backend:latest
          command:
            - "celery"
            - "-A"
            - "app.scaling.celery_app"
            - "worker"
            - "--loglevel=info"
            - "-Q"
            # Every queue celery_app routes to (goals.{plan}, workflows.*, ingestion,
            # default "celery") together with the dedicated pools below — see
            # tests/scaling/test_worker_queue_coverage.py. maintenance/governance
            # run on agentverse-maintenance-worker only (GAP-WORKER).
            - "celery,goals,goals.free,goals.starter,goals.professional,goals.enterprise,goals_dlq,schedules,triggers.poll,ingestion,workflows.free,workflows.starter,workflows.professional,workflows.enterprise,workflows.maintenance"
            - "--concurrency=4"
            - "--max-tasks-per-child=100"
            - "--max-memory-per-child=700000"
          envFrom:
            - configMapRef:
                name: agentverse-config
            - secretRef:
                name: agentverse-secrets
          env:
            - name: AGENTVERSE_DB_SCHEDULE_DISCOVERY
              value: "true"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              # L-03 budget: parent ~300 MB + 4 children x (700 MB cap + ~100 MB growth).
              memory: "3584Mi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "celery -A app.scaling.celery_app inspect ping -d celery@$HOSTNAME -t 5 2>/dev/null | grep -q OK"
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
---
# Dedicated pool for supervisor sub-goals (CORE-09). A supervisor parent holds its
# agentverse-worker slot while it waits for its sub-goals; they are routed to
# goals.subgoals.{plan}, which ONLY this pool consumes, so a parent can never
# starve its own children however busy the main pool is.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentverse-subgoal-worker
  namespace: agentverse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentverse-subgoal-worker
  template:
    metadata:
      labels:
        app: agentverse-subgoal-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9540"
        prometheus.io/path: "/metrics"
    spec:
      # NF-16: wait in Init — not CrashLoopBackOff — until the migration Job has
      # brought the schema (read as the app role) to this image's alembic head.
      initContainers:
        - name: wait-for-schema
          image: agentverse-backend:latest
          command: ["python", "-m", "app.db.wait_for_schema"]
          envFrom:
            - configMapRef:
                name: agentverse-config
            - secretRef:
                name: agentverse-secrets
      containers:
        - name: subgoal-worker
          image: agentverse-backend:latest
          command:
            - "celery"
            - "-A"
            - "app.scaling.celery_app"
            - "worker"
            - "--loglevel=info"
            - "-Q"
            - "goals.subgoals.free,goals.subgoals.starter,goals.subgoals.professional,goals.subgoals.enterprise"
            - "--concurrency=4"
            - "--max-tasks-per-child=100"
            - "--max-memory-per-child=700000"
          envFrom:
            - configMapRef:
                name: agentverse-config
            - secretRef:
                name: agentverse-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              # L-03 budget: parent ~300 MB + 4 children x (700 MB cap + ~100 MB growth).
              memory: "3584Mi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "celery -A app.scaling.celery_app inspect ping -d celery@$HOSTNAME -t 5 2>/dev/null | grep -q OK"
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
---
# Dedicated pool for the time triggers (B1-4). The beat's fire_due_schedules and
# the run_scheduled_goal / poll_trigger tasks are short (claim due rows, create and
# enqueue the goal) but shared the goal pool, so while goals ran, beat ticks and
# fires waited minutes. The goal itself still runs on agentverse-worker, which
# also consumes these queues (a stopped schedule pool degrades, never stops).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentverse-schedule-worker
  namespace: agentverse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agentverse-schedule-worker
  template:
    metadata:
      labels:
        app: agentverse-schedule-worker
    spec:
      initContainers:
        - name: wait-for-schema
          image: agentverse-backend:latest
          command: ["python", "-m", "app.db.wait_for_schema"]
          envFrom:
            - configMapRef:
                name: agentverse-config
            - secretRef:
                name: agentverse-secrets
      containers:
        - name: schedule-worker
          image: agentverse-backend:latest
          command:
            - "celery"
            - "-A"
            - "app.scaling.celery_app"
            - "worker"
            - "--loglevel=info"
            - "-Q"
            - "schedules,triggers.poll"
            - "-n"
            - "schedules@%h"
            - "--concurrency=2"
            - "--max-tasks-per-child=200"
            - "--max-memory-per-child=700000"
          envFrom:
            - configMapRef:
                name: agentverse-config
            - secretRef:
                name: agentverse-secrets
          env:
            - name: AGENTVERSE_DB_SCHEDULE_DISCOVERY
              value: "true"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              # L-03 budget: parent ~300 MB + 2 children x (700 MB cap + ~100 MB growth).
              memory: "2Gi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "celery -A app.scaling.celery_app inspect ping -d schedules@$HOSTNAME -t 5 2>/dev/null | grep -q OK"
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
---
# Dedicated pool for the beat's housekeeping (GAP-WORKER): maintenance +
# governance (outbox drains, audit WAL flush, MCP health, HITL expiry, retention,
# exports). On the shared goal pool, beat ticks queued by the thousand behind
# running goals and goals waited behind the ticks. agentverse-worker no longer
# consumes these queues.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentverse-maintenance-worker
  namespace: agentverse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agentverse-maintenance-worker
  template:
    metadata:
      labels:
        app: agentverse-maintenance-worker
    spec:
      initContainers:
        - name: wait-for-schema
          image: agentverse-backend:latest
          command: ["python", "-m", "app.db.wait_for_schema"]
          envFrom:
            - configMapRef:
                name: agentverse-config
            - secretRef:
                name: agentverse-secrets
      containers:
        - name: maintenance-worker
          image: agentverse-backend:latest
          command:
            - "celery"
            - "-A"
            - "app.scaling.celery_app"
            - "worker"
            - "--loglevel=info"
            - "-Q"
            - "maintenance,governance"
            - "-n"
            - "maintenance@%h"
            - "--concurrency=2"
            - "--max-tasks-per-child=200"
            - "--max-memory-per-child=700000"
          envFrom:
            - configMapRef:
                name: agentverse-config
            - secretRef:
                name: agentverse-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              # L-03 budget: parent ~300 MB + 2 children x (700 MB cap + ~100 MB growth).
              memory: "2Gi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "celery -A app.scaling.celery_app inspect ping -d maintenance@$HOSTNAME -t 5 2>/dev/null | grep -q OK"
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
