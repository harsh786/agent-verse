# RedBeat HA Beat: allows 2 replicas safely — only one fires each task.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentverse-beat
  namespace: agentverse
  labels:
    app: agentverse-beat
    component: beat
spec:
  replicas: 2   # HA with RedBeat distributed lock (was 1)
  selector:
    matchLabels:
      app: agentverse-beat
  template:
    metadata:
      labels:
        app: agentverse-beat
    spec:
      terminationGracePeriodSeconds: 30
      # NF-16: wait in Init — not CrashLoopBackOff — until the migration Job has
      # brought the schema (read as the app role) to this image's alembic head.
      initContainers:
        - name: wait-for-schema
          image: ghcr.io/agentverse/backend:latest
          command: ["python", "-m", "app.db.wait_for_schema"]
          envFrom:
            - configMapRef:
                name: agentverse-config
            - secretRef:
                name: agentverse-secrets
      containers:
        - name: beat
          image: ghcr.io/agentverse/backend:latest
          command:
            - celery
            - -A
            - app.scaling.celery_app
            - beat
            - --scheduler=app.scaling.beat_scheduler:AgentVerseRedBeatScheduler
            - --loglevel=info
          # Same config + Secret as the API and workers (BYOK-1): beat runs the
          # app's startup checks, which refuse to start without the vault key
          # outside development. The `redis-url` / `database-url` keys this used
          # to reference do not exist in agentverse-secrets.
          envFrom:
            - configMapRef:
                name: agentverse-config
            - secretRef:
                name: agentverse-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "pgrep -f 'celery.*beat' > /dev/null"
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
