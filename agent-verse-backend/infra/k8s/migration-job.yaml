apiVersion: batch/v1
kind: Job
metadata:
  name: agentverse-db-migration
  namespace: agentverse
  labels:
    app: agentverse-db-migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: agentverse-db-migration
    spec:
      restartPolicy: Never
      containers:
        - name: alembic-upgrade
          image: agentverse-backend:latest
          command:
            - alembic
          args:
            - upgrade
            - head
          # NF-16: alembic runs as the schema OWNER (MIGRATION_DATABASE_URL) and
          # then creates/repairs the least-privilege app role APP_DB_USER with
          # grants. Only this Job gets the owner DSN (agentverse-migration-secrets);
          # DATABASE_URL (the app role) comes from agentverse-secrets.
          envFrom:
            - configMapRef:
                name: agentverse-config
            - secretRef:
                name: agentverse-secrets
            - secretRef:
                name: agentverse-migration-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
