apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agentverse-secrets
  namespace: agentverse
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: agentverse-production-secrets
    kind: ClusterSecretStore
  target:
    name: agentverse-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: agentverse/production/postgres
        property: password
    # NF-16 (three roles): DATABASE_URL is the least-privilege APPLICATION role
    # (NOSUPERUSER, NOBYPASSRLS) via pgBouncer; MAINTENANCE_DATABASE_URL is the
    # BYPASSRLS role for cross-tenant system jobs (beat scans run on workers, the
    # API's startup warm-up). The owner DSN is NOT here: agentverse-migration-secrets.
    - secretKey: DATABASE_URL
      remoteRef:
        key: agentverse/production/database
        property: url
    - secretKey: MAINTENANCE_DATABASE_URL
      remoteRef:
        key: agentverse/production/database
        property: maintenance-url
    # The app role's own credentials, in this ONE Secret: the migration Job
    # creates/repairs the role with them and pgBouncer's auth file lists them
    # (DATABASE_URL above must use the same user/password).
    - secretKey: APP_DB_USER
      remoteRef:
        key: agentverse/production/database
        property: app-user
    - secretKey: APP_DB_PASSWORD
      remoteRef:
        key: agentverse/production/database
        property: app-password
    - secretKey: REDIS_URL
      remoteRef:
        key: agentverse/production/redis
        property: url
    - secretKey: SECRET_KEY
      remoteRef:
        key: agentverse/production/app
        property: secret-key
    # BYOK-1: the vault master key, delivered to EVERY app workload (API,
    # workers, beat, migration job) through `envFrom: secretRef` on this one
    # Secret, so the process that encrypts a tenant's BYOK key and the one that
    # decrypts it always hold the same key. (Was AGENTVERSE_VAULT_KEY; the vault
    # reads both names, but stream tokens / HITL email links read only this one.)
    # During a key rotation add VAULT_PREVIOUS_MASTER_KEYS here as well.
    - secretKey: VAULT_MASTER_KEY
      remoteRef:
        key: agentverse/production/app
        property: vault-key
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: agentverse/production/providers
        property: anthropic-api-key
---
# NF-16: the schema owner DSN, for the migration Job ONLY (alembic + provisioning
# of the app role APP_DB_USER from agentverse-secrets). No app workload
# references this Secret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agentverse-migration-secrets
  namespace: agentverse
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: agentverse-production-secrets
    kind: ClusterSecretStore
  target:
    name: agentverse-migration-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: MIGRATION_DATABASE_URL
      remoteRef:
        key: agentverse/production/database
        property: owner-url
