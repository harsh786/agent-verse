apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agentverse-secrets
  namespace: agentverse
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: agentverse-production-secrets
    kind: ClusterSecretStore
  target:
    name: agentverse-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: agentverse/production/postgres
        property: password
    - secretKey: DATABASE_URL
      remoteRef:
        key: agentverse/production/database
        property: url
    - secretKey: REDIS_URL
      remoteRef:
        key: agentverse/production/redis
        property: url
    - secretKey: SECRET_KEY
      remoteRef:
        key: agentverse/production/app
        property: secret-key
    # BYOK-1: the vault master key, delivered to EVERY app workload (API,
    # workers, beat, migration job) through `envFrom: secretRef` on this one
    # Secret, so the process that encrypts a tenant's BYOK key and the one that
    # decrypts it always hold the same key. (Was AGENTVERSE_VAULT_KEY; the vault
    # reads both names, but stream tokens / HITL email links read only this one.)
    # During a key rotation add VAULT_PREVIOUS_MASTER_KEYS here as well.
    - secretKey: VAULT_MASTER_KEY
      remoteRef:
        key: agentverse/production/app
        property: vault-key
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: agentverse/production/providers
        property: anthropic-api-key
