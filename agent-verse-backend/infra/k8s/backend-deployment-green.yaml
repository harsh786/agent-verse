apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentverse-backend-green
  namespace: agentverse
  labels:
    app: agentverse-backend
    color: green
spec:
  replicas: 0   # starts at 0; scaled up before traffic switch
  selector:
    matchLabels:
      app: agentverse-backend
      color: green
  template:
    metadata:
      labels:
        app: agentverse-backend
        color: green
    spec:
      terminationGracePeriodSeconds: 60
      # NF-16: wait in Init — not CrashLoopBackOff — until the migration Job has
      # brought the schema (read as the app role) to this image's alembic head.
      initContainers:
        - name: wait-for-schema
          image: ghcr.io/agentverse/backend:latest
          command: ["python", "-m", "app.db.wait_for_schema"]
          envFrom:
            - configMapRef:
                name: agentverse-config
            - secretRef:
                name: agentverse-secrets
      containers:
        - name: backend
          image: ghcr.io/agentverse/backend:latest   # update image tag before switching
          ports:
            - containerPort: 8000
          # NF-16: the image CMD migrates first; this least-privilege app role
          # cannot run DDL — the PreSync migration Job does it as the owner.
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
          # DATABASE_URL, REDIS_URL and the vault master key come from the same
          # Secret as every other app workload (BYOK-1). The explicit
          # `database-url` / `redis-url` keys this used to reference do not exist
          # in agentverse-secrets, so the pod could not start.
          envFrom:
            - configMapRef:
                name: agentverse-config
            - secretRef:
                name: agentverse-secrets
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 4
