apiVersion: v1
kind: Secret
metadata:
  name: agentverse-secrets
  namespace: agentverse
  annotations:
    agentverse.io/scope: "dev-only"
    agentverse.io/warning: "Do not include this placeholder Secret in production kustomization."
type: Opaque
stringData:
  # NF-16: the least-privilege app role (created by the migration Job) ...
  DATABASE_URL: "postgresql+asyncpg://agentverse_app:CHANGE_ME@pgbouncer:5432/agentverse"
  # ... and the BYPASSRLS maintenance role for cross-tenant system jobs.
  MAINTENANCE_DATABASE_URL: "postgresql+asyncpg://agentverse:CHANGE_ME@pgbouncer:5432/agentverse"
  REDIS_URL: "redis://:CHANGE_ME@redis:6379/0"
  SECRET_KEY: "CHANGE_ME_USE_openssl_rand_-hex_32"
  ANTHROPIC_API_KEY: ""
  POSTGRES_PASSWORD: "CHANGE_ME"
  # Vault master key for at-rest secret encryption (tenant BYOK LLM keys,
  # connector secrets). Every app workload reads it through envFrom.
  VAULT_MASTER_KEY: "CHANGE_ME_USE_openssl_rand_-hex_32"
  # Comma-separated previous master keys, set only during `agentverse vault-rotate`.
  VAULT_PREVIOUS_MASTER_KEYS: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: agentverse-migration-secrets
  namespace: agentverse
  annotations:
    agentverse.io/scope: "dev-only"
    agentverse.io/warning: "Do not include this placeholder Secret in production kustomization."
type: Opaque
stringData:
  # NF-16: schema owner (migration Job only). Through pgBouncer, the only DB
  # endpoint the egress NetworkPolicy allows.
  MIGRATION_DATABASE_URL: "postgresql+asyncpg://agentverse:CHANGE_ME@pgbouncer:5432/agentverse"
  APP_DB_USER: "agentverse_app"
  APP_DB_PASSWORD: "CHANGE_ME"
