apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: agentverse
  labels:
    app: pgbouncer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      containers:
        - name: pgbouncer
          # NF-16: the image compose runs, wrapped by the same add-app-user.sh, so
          # the auth file knows the owner (DB_USER: migrations), the
          # least-privilege app role every app pod connects as (APP_DB_USER) and
          # a separate BYPASSRLS maintenance role (MAINTENANCE_DB_USER) when one
          # is used. bitnami's image knew neither app nor owner credentials.
          image: edoburu/pgbouncer:v1.25.2-p0
          command: ["/bin/sh", "/opt/agentverse/add-app-user.sh"]
          args: ["/usr/bin/pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: scripts
              mountPath: /opt/agentverse
              readOnly: true
          env:
            - name: DB_HOST
              value: "postgres"  # K8s service name
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "agentverse"
            - name: DB_USER
              value: "agentverse"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentverse-secrets
                  key: POSTGRES_PASSWORD
            # The app role's credentials: the SAME Secret keys the migration Job
            # creates the role with and the apps' DATABASE_URL carries.
            - name: APP_DB_USER
              valueFrom:
                secretKeyRef:
                  name: agentverse-secrets
                  key: APP_DB_USER
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentverse-secrets
                  key: APP_DB_PASSWORD
            # The BYPASSRLS maintenance role MAINTENANCE_DATABASE_URL connects as
            # (same Secret). Optional: absent, or equal to DB_USER (the owner the
            # image writes itself), it needs no entry; a separate role is added.
            - name: MAINTENANCE_DB_USER
              valueFrom:
                secretKeyRef:
                  name: agentverse-secrets
                  key: MAINTENANCE_DB_USER
                  optional: true
            - name: MAINTENANCE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentverse-secrets
                  key: MAINTENANCE_DB_PASSWORD
                  optional: true
            - name: AUTH_TYPE
              value: "scram-sha-256"
            - name: LISTEN_PORT
              value: "5432"
            - name: POOL_MODE
              value: "transaction"
            - name: MAX_CLIENT_CONN
              value: "200"
            - name: DEFAULT_POOL_SIZE
              value: "20"
            # Two (database, user) pools (app role + owner) share Postgres's
            # default 100 connections.
            - name: MAX_DB_CONNECTIONS
              value: "80"
            # Every startup parameter asyncpg sends (app/db/session.py), or
            # PgBouncer refuses the connection.
            - name: IGNORE_STARTUP_PARAMETERS
              value: "extra_float_digits,statement_timeout,idle_in_transaction_session_timeout"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: scripts
          configMap:
            name: pgbouncer-scripts
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: agentverse
spec:
  selector:
    app: pgbouncer
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
---
# Byte-identical copy of infra/pgbouncer/add-app-user.sh (kustomize cannot load
# files outside this directory); tests/infra/test_vault_key_distribution.py
# fails if the two drift.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-scripts
  namespace: agentverse
data:
  add-app-user.sh: |
    #!/bin/sh
    # PgBouncer entrypoint wrapper: register the application and maintenance roles.
    #
    # The edoburu image writes ONE user (DB_USER, the owner `agentverse`) into its
    # auth file. The API and workers connect as APP_DB_USER (NOSUPERUSER,
    # NOBYPASSRLS), and the cross-tenant system jobs (MAINTENANCE_DATABASE_URL) as
    # the BYPASSRLS maintenance role MAINTENANCE_DB_USER — the owner by default, a
    # separate role when one is provisioned. Those credentials are added here too —
    # scram-sha-256 with a plain-text auth file, as the image does for DB_USER —
    # before handing over to the image's own entrypoint. Passwords are never echoed.
    set -eu

    : "${APP_DB_USER:?APP_DB_USER must be set}"
    : "${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}"

    auth_file="${AUTH_FILE:-/etc/pgbouncer/userlist.txt}"
    touch "$auth_file"

    add_user() {
      if ! grep -q "^\"$1\" " "$auth_file"; then
        printf '"%s" "%s"\n' "$1" "$2" >> "$auth_file"
        echo "Wrote authentication credentials for '$1' to ${auth_file}"
      fi
    }

    add_user "$APP_DB_USER" "$APP_DB_PASSWORD"

    # Optional: unset/empty, or the owner (DB_USER, which the image writes itself),
    # needs no entry of its own.
    maintenance_user="${MAINTENANCE_DB_USER:-}"
    if [ -n "$maintenance_user" ] && [ "$maintenance_user" != "${DB_USER:-}" ]; then
      if [ "$maintenance_user" = "$APP_DB_USER" ]; then
        # The app role is NOBYPASSRLS: as the maintenance role every cross-tenant
        # system job would silently see one tenant (or none).
        echo "MAINTENANCE_DB_USER must not be the application role '${APP_DB_USER}'" >&2
        exit 1
      fi
      : "${MAINTENANCE_DB_PASSWORD:?MAINTENANCE_DB_PASSWORD must be set with MAINTENANCE_DB_USER}"
      add_user "$maintenance_user" "$MAINTENANCE_DB_PASSWORD"
    fi

    exec /entrypoint.sh "$@"
