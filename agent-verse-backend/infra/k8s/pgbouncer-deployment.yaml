apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: agentverse
  labels:
    app: pgbouncer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      containers:
        - name: pgbouncer
          # NF-16: the image compose runs, wrapped by the same add-app-user.sh, so
          # the auth file knows BOTH the owner (DB_USER: migrations, maintenance)
          # and the least-privilege app role every app pod connects as
          # (APP_DB_USER). bitnami's image knew neither app nor owner credentials.
          image: edoburu/pgbouncer:v1.25.2-p0
          command: ["/bin/sh", "/opt/agentverse/add-app-user.sh"]
          args: ["/usr/bin/pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: scripts
              mountPath: /opt/agentverse
              readOnly: true
          env:
            - name: DB_HOST
              value: "postgres"  # K8s service name
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "agentverse"
            - name: DB_USER
              value: "agentverse"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentverse-secrets
                  key: POSTGRES_PASSWORD
            # The app role's credentials: the SAME Secret keys the migration Job
            # creates the role with and the apps' DATABASE_URL carries.
            - name: APP_DB_USER
              valueFrom:
                secretKeyRef:
                  name: agentverse-secrets
                  key: APP_DB_USER
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentverse-secrets
                  key: APP_DB_PASSWORD
            - name: AUTH_TYPE
              value: "scram-sha-256"
            - name: LISTEN_PORT
              value: "5432"
            - name: POOL_MODE
              value: "transaction"
            - name: MAX_CLIENT_CONN
              value: "200"
            - name: DEFAULT_POOL_SIZE
              value: "20"
            # Two (database, user) pools (app role + owner) share Postgres's
            # default 100 connections.
            - name: MAX_DB_CONNECTIONS
              value: "80"
            # Every startup parameter asyncpg sends (app/db/session.py), or
            # PgBouncer refuses the connection.
            - name: IGNORE_STARTUP_PARAMETERS
              value: "extra_float_digits,statement_timeout,idle_in_transaction_session_timeout"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: scripts
          configMap:
            name: pgbouncer-scripts
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: agentverse
spec:
  selector:
    app: pgbouncer
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
---
# Byte-identical copy of infra/pgbouncer/add-app-user.sh (kustomize cannot load
# files outside this directory); tests/infra/test_vault_key_distribution.py
# fails if the two drift.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-scripts
  namespace: agentverse
data:
  add-app-user.sh: |
    #!/bin/sh
    # PgBouncer entrypoint wrapper: register the least-privilege application role.
    #
    # The edoburu image writes ONE user (DB_USER, the owner `agentverse`) into its
    # auth file. The API and workers now connect as APP_DB_USER (NOSUPERUSER,
    # NOBYPASSRLS), so that role's credentials are added here too — scram-sha-256
    # with a plain-text auth file, as the image does for DB_USER — before handing
    # over to the image's own entrypoint.
    set -eu

    : "${APP_DB_USER:?APP_DB_USER must be set}"
    : "${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}"

    auth_file="${AUTH_FILE:-/etc/pgbouncer/userlist.txt}"
    touch "$auth_file"
    if ! grep -q "^\"${APP_DB_USER}\" " "$auth_file"; then
      printf '"%s" "%s"\n' "$APP_DB_USER" "$APP_DB_PASSWORD" >> "$auth_file"
      echo "Wrote authentication credentials for '${APP_DB_USER}' to ${auth_file}"
    fi

    exec /entrypoint.sh "$@"
