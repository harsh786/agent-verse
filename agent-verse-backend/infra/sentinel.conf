# Redis Sentinel configuration for local HA testing.
# Used by docker-compose --profile sentinel.
#
# The sentinel monitors the primary "redis" container (service name resolves
# inside Docker network).  At least 2 out of 3 sentinels must agree before
# a failover is triggered (quorum = 2).

bind 0.0.0.0
port 26379

# Monitor the primary: <name> <host> <port> <quorum>
sentinel monitor mymaster redis 6379 2

# Mark the primary as down after 5 s without a response.
sentinel down-after-milliseconds mymaster 5000

# Allow at most 1 replica to sync from the new primary during failover.
sentinel parallel-syncs mymaster 1

# Failover must complete within 10 s, else it is retried.
sentinel failover-timeout mymaster 10000
