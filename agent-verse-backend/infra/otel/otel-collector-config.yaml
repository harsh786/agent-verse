# OpenTelemetry Collector configuration
# Receives traces/metrics from backend, exports to Jaeger (traces) and Prometheus (metrics).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  memory_limiter:
    limit_mib: 256
    spike_limit_mib: 64
    check_interval: 5s
  resource:
    attributes:
      - key: service.environment
        value: development
        action: upsert

exporters:
  otlp/jaeger:
    endpoint: jaeger:14250
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: agentverse
  # LLM-native observability: fan the SAME spans out to Langfuse over OTLP/HTTP.
  # Langfuse authenticates OTLP with Basic base64(public_key:secret_key); the value
  # is supplied via env so no keys live in the repo. Disabled automatically when the
  # env var is unset (the exporter still loads; the pipeline simply has no auth and
  # Langfuse rejects — so we keep it in a dedicated pipeline the compose can omit).
  otlphttp/langfuse:
    endpoint: ${env:LANGFUSE_OTEL_ENDPOINT}
    headers:
      Authorization: ${env:LANGFUSE_OTEL_BASIC_AUTH}
  logging:
    verbosity: normal

service:
  pipelines:
    # Engineering trace view (full span tree incl. DB/HTTP/Celery).
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger, logging]
    # LLM-native view: gen_ai spans + the whole tree land in Langfuse as
    # traces/generations/sessions with token/cost/latency analytics.
    traces/langfuse:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/langfuse]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
