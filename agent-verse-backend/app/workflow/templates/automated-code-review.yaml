slug: automated-code-review
name: "Automated Code Review"
description: "LLM-powered code review with security, style, and complexity checks"
category: "Engineering"
version: "1.0.0"
author: "AgentVerse Team"
complexity: "medium"
tags: ['code-review', 'ci', 'quality']
popularity_score: 0.0
sample_input:
  topic: "example"
definition:
  name: "Automated Code Review"
  description: "LLM-powered code review with security, style, and complexity checks"
  inputs:
    topic:
      type: string
      required: true
      description: "Main input for the workflow"
  steps:
    - id: main_step
      type: llm
      prompt: "Process the following for Automated Code Review: {{inputs.topic}}"
      model: gpt-4o
    - id: review
      type: hitl
      depends_on: [main_step]
      assignee:
        role: reviewer
      actions:
        - id: approve
          label: Approve
        - id: reject
          label: Reject
    - id: complete
      type: emit_event
      depends_on: [review]
      event_channel_out: workflow.completed
      event_payload:
        result: "{{steps.main_step.output}}"
        action: "{{steps.review.output.action}}"
