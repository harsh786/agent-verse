apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentverse-worker
  namespace: {{ .Values.global.namespace }}
  labels:
    app: agentverse-worker
    component: worker
    {{- include "agentverse.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: agentverse-worker
  template:
    metadata:
      labels:
        app: agentverse-worker
        component: worker
    spec:
      terminationGracePeriodSeconds: 120
      # NF-16: wait in Init — not CrashLoopBackOff — until the schema, read as the
      # app role (DATABASE_URL), is at this image's alembic head
      # (app/db/wait_for_schema.py). The migrate Job (migrate-job.yaml) or, with
      # migrations.enabled=false, the API's start-up migration brings it there.
      initContainers:
        - name: wait-for-schema
          image: {{ include "agentverse.workerImage" . }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["python", "-m", "app.db.wait_for_schema"]
          env:
            {{- include "agentverse.appSecretEnv" . | nindent 12 }}
      containers:
        - name: worker
          image: {{ include "agentverse.workerImage" . }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - celery
            - -A
            - app.scaling.celery_app
            - worker
            - --loglevel=info
            - --concurrency={{ .Values.worker.concurrency }}
            - --max-tasks-per-child={{ .Values.worker.maxTasksPerChild }}
            - --max-memory-per-child={{ .Values.worker.maxMemoryPerChildKb }}
            - -Q
            - {{ .Values.worker.queues }}
          envFrom:
            - configMapRef:
                name: agentverse-config
          env:
            {{- include "agentverse.appSecretEnv" . | nindent 12 }}
            - name: WORKER_PRELOAD_RETRIEVAL_MODELS
              value: {{ .Values.worker.preloadRetrievalModels | quote }}
            {{- include "agentverse.codeSandboxEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
