{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agentverse-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "agentverse.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: agentverse-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.databaseUrl.remoteRef.key }}
    - secretKey: redis-url
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.redisUrl.remoteRef.key }}
    - secretKey: anthropic-api-key
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.anthropicApiKey.remoteRef.key }}
    - secretKey: master-encryption-key
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.masterEncryptionKey.remoteRef.key }}
    {{- /* NF-16: the three database roles (each optional). */}}
    {{- with .Values.externalSecrets.secrets.maintenanceDatabaseUrl }}
    - secretKey: maintenance-database-url
      remoteRef:
        key: {{ .remoteRef.key }}
    {{- end }}
    {{- with .Values.externalSecrets.secrets.migrationDatabaseUrl }}
    - secretKey: migration-database-url
      remoteRef:
        key: {{ .remoteRef.key }}
    {{- end }}
    {{- with .Values.externalSecrets.secrets.appDbUser }}
    - secretKey: app-db-user
      remoteRef:
        key: {{ .remoteRef.key }}
    {{- end }}
    {{- with .Values.externalSecrets.secrets.appDbPassword }}
    - secretKey: app-db-password
      remoteRef:
        key: {{ .remoteRef.key }}
    {{- end }}
{{- end }}
