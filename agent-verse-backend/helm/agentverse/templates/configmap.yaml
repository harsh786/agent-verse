apiVersion: v1
kind: ConfigMap
metadata:
  name: agentverse-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "agentverse.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.backend.env.ENVIRONMENT | quote }}
  LOG_LEVEL: {{ .Values.backend.env.LOG_LEVEL | quote }}
  DEFAULT_LLM_PROVIDER: {{ .Values.backend.env.DEFAULT_LLM_PROVIDER | quote }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otlpEndpoint | quote }}
  METRICS_ENABLED: {{ .Values.config.metricsEnabled | quote }}
  # DEF-NEW-1: messaging gateway public HTTPS base URL (values: gateway.publicBaseUrl).
  GATEWAY_PUBLIC_BASE_URL: {{ .Values.gateway.publicBaseUrl | quote }}
  # EGRESS-CFG: operator-only connector egress escape hatch (values: ingestion.*).
  # Every app workload (API, workers, beat) reads this one ConfigMap.
  INGESTION_ALLOW_INTERNAL_SOURCES: {{ .Values.ingestion.allowInternalSources | quote }}
  INGESTION_INTERNAL_SOURCE_ALLOWLIST: {{ .Values.ingestion.internalSourceAllowlist | quote }}
  ALLOW_PRIVATE_NETWORK_ACCESS: {{ .Values.ingestion.allowPrivateNetworkAccess | quote }}
  INGESTION_SYNC_DOC_CONCURRENCY: {{ .Values.ingestion.syncDocConcurrency | quote }}
  # BUG A defence in depth: botocore never asks the EC2 instance metadata service.
  AWS_EC2_METADATA_DISABLED: "true"
  # BUG B: the embedding provider (values: embedding.*; keys from agentverse-secrets).
  {{- with .Values.embedding }}
  {{- if .nvidiaEmbedModel }}
  NVIDIA_EMBED_MODEL: {{ .nvidiaEmbedModel | quote }}
  {{- end }}
  {{- if .nvidiaEmbedDim }}
  NVIDIA_EMBED_DIM: {{ .nvidiaEmbedDim | quote }}
  {{- end }}
  {{- if .baseUrl }}
  EMBEDDING_BASE_URL: {{ .baseUrl | quote }}
  {{- end }}
  {{- if .model }}
  EMBEDDING_MODEL: {{ .model | quote }}
  {{- end }}
  {{- if .dim }}
  EMBEDDING_DIM: {{ .dim | quote }}
  {{- end }}
  {{- end }}
  # a06-F099-03: dead-worker message restore (values: celeryDeadWorkerRestore.*).
  CELERY_DEAD_WORKER_RESTORE_ENABLED: {{ .Values.celeryDeadWorkerRestore.enabled | quote }}
  CELERY_DEAD_WORKER_GRACE_SECONDS: {{ .Values.celeryDeadWorkerRestore.graceSeconds | quote }}
  # OCR-PAR: OCR parallelism (values: ocr.*). Every app workload reads this one ConfigMap.
  OCR_TESSERACT_ENABLED: {{ .Values.ocr.tesseractEnabled | quote }}
  OCR_MAX_CONCURRENCY: {{ .Values.ocr.maxConcurrency | quote }}
  OCR_PAGE_CONCURRENCY: {{ .Values.ocr.pageConcurrency | quote }}
  OCR_VISION_CONCURRENCY: {{ .Values.ocr.visionConcurrency | quote }}
  OCR_RENDER_DPI: {{ .Values.ocr.renderDpi | quote }}
  OMP_THREAD_LIMIT: {{ .Values.ocr.ompThreadLimit | quote }}
