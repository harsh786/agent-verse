# Dedicated pool for supervisor sub-goals (CORE-09): a supervisor parent holds its
# agentverse-worker slot while it waits, so its sub-goals (goals.subgoals.{plan})
# are consumed only by this pool and can never queue behind their own parent.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentverse-subgoal-worker
  namespace: {{ .Values.global.namespace }}
  labels:
    app: agentverse-subgoal-worker
    component: subgoal-worker
    {{- include "agentverse.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.subgoalWorker.replicas }}
  selector:
    matchLabels:
      app: agentverse-subgoal-worker
  template:
    metadata:
      labels:
        app: agentverse-subgoal-worker
        component: subgoal-worker
    spec:
      terminationGracePeriodSeconds: 120
      # NF-16: wait in Init — not CrashLoopBackOff — until the schema, read as the
      # app role (DATABASE_URL), is at this image's alembic head
      # (app/db/wait_for_schema.py). The migrate Job (migrate-job.yaml) or, with
      # migrations.enabled=false, the API's start-up migration brings it there.
      initContainers:
        - name: wait-for-schema
          image: {{ include "agentverse.subgoalWorkerImage" . }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["python", "-m", "app.db.wait_for_schema"]
          env:
            {{- include "agentverse.appSecretEnv" . | nindent 12 }}
      containers:
        - name: subgoal-worker
          image: {{ include "agentverse.subgoalWorkerImage" . }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - celery
            - -A
            - app.scaling.celery_app
            - worker
            - --loglevel=info
            - --concurrency={{ .Values.subgoalWorker.concurrency }}
            - --max-tasks-per-child={{ .Values.subgoalWorker.maxTasksPerChild }}
            - --max-memory-per-child={{ .Values.subgoalWorker.maxMemoryPerChildKb }}
            - -Q
            - {{ .Values.subgoalWorker.queues }}
          envFrom:
            - configMapRef:
                name: agentverse-config
          env:
            {{- include "agentverse.appSecretEnv" . | nindent 12 }}
            - name: WORKER_PRELOAD_RETRIEVAL_MODELS
              value: {{ .Values.subgoalWorker.preloadRetrievalModels | quote }}
            {{- include "agentverse.codeSandboxEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.subgoalWorker.resources | nindent 12 }}
