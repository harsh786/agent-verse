# Default values for agentverse Helm chart.
# Override with: helm install agentverse ./helm/agentverse -f custom-values.yaml

global:
  imageRegistry: "ghcr.io/agentverse"
  imagePullPolicy: IfNotPresent
  namespace: agentverse

# ── Backend API ──────────────────────────────────────────────────────────────
backend:
  image:
    name: backend
    tag: "latest"
  replicas: 2
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 3.5Gi  # D4 / L-03 budget
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    minAvailable: 1
  env:
    ENVIRONMENT: production
    LOG_LEVEL: INFO
    DEFAULT_LLM_PROVIDER: anthropic

# ── Celery Worker ─────────────────────────────────────────────────────────────
# Worker memory budget (owner decision D4, same numbers as L-03 in
# infra/docker-compose.prod.yml and infra/k8s/worker-deployment.yaml):
#   concurrency 4 processes per pod; scale throughput with replicas (pods), not
#   with concurrency.
#   maxMemoryPerChildKb 700000 (700 MB) -- Celery recycles a child after a task
#   once its RSS passes this; a child that has reranked needs ~600 MB, so it is
#   not recycled after every search.
#   limit 3.5Gi (3584 Mi) >= parent ~300 MB + 4 x (700 MB cap + ~100 MB one-task
#   overshoot) = 3500 MB. Enforced by tests/scaling/test_worker_memory_budget.py.
#   preloadRetrievalModels false -- children load torch/the cross-encoder lazily
#   on first use instead of every child paying ~450 MB at start (L-03).
worker:
  image:
    name: backend
    tag: "latest"
  replicas: 2
  concurrency: 4
  maxTasksPerChild: 100
  maxMemoryPerChildKb: 700000
  preloadRetrievalModels: false
  # Together with the dedicated pools below, must cover every queue
  # celery_app.py routes to (plan-routed goals.* and workflows.*), or those
  # tasks sit unconsumed. maintenance/governance run on maintenanceWorker only
  # (GAP-WORKER). Mirrors infra/helm/agentverse.
  queues: "celery,goals,goals.free,goals.starter,goals.professional,goals.enterprise,goals_dlq,schedules,ingestion,workflows.free,workflows.starter,workflows.professional,workflows.enterprise,workflows.maintenance"
  resources:
    requests:
      cpu: 300m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 3.5Gi  # D4 / L-03 budget, see the comment above `worker:`
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 60

# ── Celery sub-goal worker (CORE-09) ──────────────────────────────────────────
# Dedicated pool for supervisor sub-goals. worker.queues must NOT list these: a
# supervisor parent holds its worker slot while waiting, so its sub-goals need
# slots the parents can never occupy. Mirrors infra/helm/agentverse.
subgoalWorker:
  image:
    name: backend
    tag: "latest"
  replicas: 1
  concurrency: 4
  maxTasksPerChild: 100
  maxMemoryPerChildKb: 700000
  preloadRetrievalModels: false
  queues: "goals.subgoals.free,goals.subgoals.starter,goals.subgoals.professional,goals.subgoals.enterprise"
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 3.5Gi  # D4 / L-03 budget, see the comment above `worker:`

# ── Celery schedule worker (B1-4) ─────────────────────────────────────────────
# Dedicated pool for the time triggers: the beat's fire_due_schedules and the
# run_scheduled_goal / poll_trigger tasks must never wait behind running goals.
# worker.queues also lists them, so a stopped pool degrades instead of stopping.
scheduleWorker:
  enabled: true
  image:
    name: backend
    tag: "latest"
  replicas: 2
  concurrency: 2
  maxTasksPerChild: 200
  maxMemoryPerChildKb: 700000
  queues: "schedules,triggers.poll"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 2Gi  # L-03 budget: 300 MB + 2 x (700 MB cap + 100 MB)

# ── Celery maintenance worker (GAP-WORKER) ───────────────────────────────────
# Dedicated pool for the beat's housekeeping (maintenance + governance: outbox
# drains, audit WAL flush, MCP health, HITL expiry, retention, exports). On the
# shared goal pool thousands of beat ticks queued behind running goals and goals
# waited behind the ticks. worker.queues does NOT list these queues, so keep
# this pool enabled wherever the worker runs.
maintenanceWorker:
  enabled: true
  image:
    name: backend
    tag: "latest"
  replicas: 2
  concurrency: 2
  maxTasksPerChild: 200
  maxMemoryPerChildKb: 700000
  queues: "maintenance,governance"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 2Gi  # L-03 budget: 300 MB + 2 x (700 MB cap + 100 MB)

# ── Celery Beat ───────────────────────────────────────────────────────────────
beat:
  image:
    name: backend
    tag: "latest"
  replicas: 2  # HA with RedBeat
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ── Frontend ──────────────────────────────────────────────────────────────────
frontend:
  image:
    name: frontend
    tag: "latest"
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  host: agentverse.example.com
  tls:
    enabled: true
    secretName: agentverse-tls

# ── External Secrets ─────────────────────────────────────────────────────────
externalSecrets:
  enabled: true
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  refreshInterval: 1h
  secrets:
    databaseUrl:
      remoteRef:
        key: agentverse/database-url
    redisUrl:
      remoteRef:
        key: agentverse/redis-url
    anthropicApiKey:
      remoteRef:
        key: agentverse/anthropic-api-key
    masterEncryptionKey:
      remoteRef:
        key: agentverse/master-encryption-key
    # NF-16 (three roles, see the repo-root CLAUDE.md): database-url should be the
    # least-privilege app role; the BYPASSRLS maintenance role serves the
    # cross-tenant system jobs; the owner DSN + app role credentials let the
    # API's start-up migration provision that app role. Remove an entry to skip it.
    maintenanceDatabaseUrl:
      remoteRef:
        key: agentverse/maintenance-database-url
    migrationDatabaseUrl:
      remoteRef:
        key: agentverse/migration-database-url
    appDbUser:
      remoteRef:
        key: agentverse/app-db-user
    appDbPassword:
      remoteRef:
        key: agentverse/app-db-password

# DEF-NEW-1: public HTTPS base URL of the messaging gateway (GATEWAY_PUBLIC_BASE_URL),
# e.g. "https://agents.example.com" (optional path prefix). With it the server
# registers Telegram bindings with setWebhook and returns absolute channel callback
# URLs; empty = tenants register their webhooks by hand. https only (anything else
# is treated as unset). Rendered into the shared config map (API + workers + beat).
gateway:
  publicBaseUrl: ""

# EGRESS-CFG: connector egress escape hatch — OPERATOR-ONLY, never tenant-settable.
# Connectors refuse private / loopback / link-local / metadata addresses. To let them
# reach your own internal infrastructure (e.g. a MinIO on 192.168.63.104) set
# allowInternalSources: true AND list each host in internalSourceAllowlist
# (comma-separated hostnames or IP literals, e.g. "192.168.63.104,minio.internal").
# The list alone does nothing. Rendered into the shared config map, so the API and
# every worker / beat enforce the same policy.
ingestion:
  allowInternalSources: false
  internalSourceAllowlist: ""
  # Private / internal hosts and IPs for ingestion, connectors and model
  # endpoints (cloud metadata / link-local still blocked). false = public only.
  allowPrivateNetworkAccess: true

# OCR-PAR: OCR parallelism, one bounded pool per process shared by every document
# (uploads, /ocr, ZIP members, ingestion jobs). maxConcurrency = OCR threads and
# page bitmaps in flight per process (0 = the pod's CPU limit / quota, split
# between a prefork worker's children); pageConcurrency = pages of ONE document at
# once (0 = maxConcurrency - 1, min 2); visionConcurrency = LLM-vision fallback
# calls in flight; renderDpi = scanned-page rasterisation; ompThreadLimit pins
# tesseract's OpenMP threads (pages already run in parallel). Rendered into the
# shared config map, so the API and every worker use the same limits.
ocr:
  # false (default) = skip Tesseract; the LLM-vision OCR model reads every page.
  tesseractEnabled: false
  maxConcurrency: 0
  pageConcurrency: 0
  visionConcurrency: 4
  renderDpi: 300
  ompThreadLimit: 1

# ── Non-secret config ─────────────────────────────────────────────────────────
config:
  corsOrigins: "https://agentverse.example.com"
  otlpEndpoint: "http://otel-collector:4317"
  metricsEnabled: "true"
  semanticCacheEnabled: "true"

# Fail-closed staged rollout controls. Empty allowlists and disabled family flags admit no
# pattern canary traffic until signed certification evidence is supplied.
agentPatternRollout:
  tenantAllowlist: []
  familyFlags:
    reasoning: false
    rag: false
    multiAgent: false
    memory: false
  adapterVersionPins: {}
  killSwitch: false
  cohortPercentage: 0
  minimumSamples: 300
  internalObservationHours: 24
  cohortObservationHours: 72
