# Default values for agentverse Helm chart.
# Override with: helm install agentverse ./helm/agentverse -f custom-values.yaml

global:
  imageRegistry: "ghcr.io/agentverse"
  imagePullPolicy: IfNotPresent
  namespace: agentverse

# ── Backend API ──────────────────────────────────────────────────────────────
backend:
  image:
    name: backend
    tag: "latest"
  replicas: 2
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    minAvailable: 1
  env:
    ENVIRONMENT: production
    LOG_LEVEL: INFO
    DEFAULT_LLM_PROVIDER: anthropic

# ── Celery Worker ─────────────────────────────────────────────────────────────
worker:
  image:
    name: backend
    tag: "latest"
  replicas: 2
  concurrency: 4
  # Must cover every queue celery_app.py routes to (plan-routed goals.* and
  # workflows.*), or those tasks sit unconsumed. Mirrors infra/helm/agentverse.
  queues: "celery,goals,goals.free,goals.starter,goals.professional,goals.enterprise,goals_dlq,schedules,maintenance,governance,ingestion,workflows.free,workflows.starter,workflows.professional,workflows.enterprise,workflows.maintenance"
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 60

# ── Celery sub-goal worker (CORE-09) ──────────────────────────────────────────
# Dedicated pool for supervisor sub-goals. worker.queues must NOT list these: a
# supervisor parent holds its worker slot while waiting, so its sub-goals need
# slots the parents can never occupy. Mirrors infra/helm/agentverse.
subgoalWorker:
  image:
    name: backend
    tag: "latest"
  replicas: 1
  concurrency: 4
  queues: "goals.subgoals.free,goals.subgoals.starter,goals.subgoals.professional,goals.subgoals.enterprise"
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# ── Celery Beat ───────────────────────────────────────────────────────────────
beat:
  image:
    name: backend
    tag: "latest"
  replicas: 2  # HA with RedBeat
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ── Frontend ──────────────────────────────────────────────────────────────────
frontend:
  image:
    name: frontend
    tag: "latest"
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  host: agentverse.example.com
  tls:
    enabled: true
    secretName: agentverse-tls

# ── External Secrets ─────────────────────────────────────────────────────────
externalSecrets:
  enabled: true
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  refreshInterval: 1h
  secrets:
    databaseUrl:
      remoteRef:
        key: agentverse/database-url
    redisUrl:
      remoteRef:
        key: agentverse/redis-url
    anthropicApiKey:
      remoteRef:
        key: agentverse/anthropic-api-key
    masterEncryptionKey:
      remoteRef:
        key: agentverse/master-encryption-key

# ── Non-secret config ─────────────────────────────────────────────────────────
config:
  corsOrigins: "https://agentverse.example.com"
  otlpEndpoint: "http://otel-collector:4317"
  metricsEnabled: "true"
  semanticCacheEnabled: "true"

# Fail-closed staged rollout controls. Empty allowlists and disabled family flags admit no
# pattern canary traffic until signed certification evidence is supplied.
agentPatternRollout:
  tenantAllowlist: []
  familyFlags:
    reasoning: false
    rag: false
    multiAgent: false
    memory: false
  adapterVersionPins: {}
  killSwitch: false
  cohortPercentage: 0
  minimumSamples: 300
  internalObservationHours: 24
  cohortObservationHours: 72
